# The Windows build, on each processor there is a target for. zig is the one tool
# fetched: build.py fetches Binaryen itself on Windows, at its pin - docs/design/dependencies.md.
# Python is asked for by processor, since build.py builds for the processor Python says it runs
# on, and one that ran emulated would have it build the other target.
name: windows

# It runs for what reaches dev, and for a pull request: a stage's branch is held by the cases
# run where it is written, and main only ever takes what dev already passed with. A change to
# documents alone, or to these workflows, starts nothing, and a newer push stops the run of the
# one before it, since a minute here is counted and a macOS one as ten.
on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**.md', 'license', '.github/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'license', '.github/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 only. On the arm64 runner the arm64 build of zig 0.16.0 is ended by the
          # system for an access violation when several run at once, and one at a time does not
          # finish in an hour: docs/design/build.md, "Platforms". The target is still compiled
          # and linked, from x86-64.
          - processor: x86_64
            python: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZIG_VERSION: 0.16.0
      PROCESSOR: ${{ matrix.processor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python }}

      - name: Tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          curl -fsSL -o zig.zip "https://ziglang.org/download/${ZIG_VERSION}/zig-${PROCESSOR}-windows-${ZIG_VERSION}.zip"
          unzip -q zig.zip
          cygpath -w "$HOME/tools/zig-${PROCESSOR}-windows-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build and test
        run: python build.py test

      # each case six times at once, ten times over: what a case alone does not find -
      # docs/plan/stage13.md, *Under load*
      - name: Under load
        run: python build.py test --copies 6 --rounds 10
