# Asks whoever opens a pull request to sign cla.md, once, and remembers who has:
# docs/licence.md, "Whose it is". What decides is tools/cla.py, and this only runs it.
#
# It answers to strangers and may write to the repository, so it never runs anything of a pull
# request: the file it runs is the one on the default branch, and the pull request is read as
# data. That is why the first event is pull_request_target and not pull_request, and why the
# checkout names the default branch.
#
# The record is signatures.json on the branch cla-signatures of this repository. The token the
# service hands a workflow is enough for it.
name: cla

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Decide, ask or record
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/cla.py
