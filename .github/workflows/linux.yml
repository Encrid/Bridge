# The Linux build, on each processor there is a target for: the half of every
# stage's claim a Windows machine cannot check. The tools are the ones the build asks for, at the
# versions every other run uses - docs/design/dependencies.md.
name: linux

# It runs for what reaches main, and for a pull request: a stage's branch and dev are held by
# the cases run where they are written. A run for main publishes what a host is handed, for
# the commit it ran: docs/seam/host_api/host_api.md, "What a host is handed". A change to
# documents alone, or to these workflows, starts nothing, and a newer push stops the run of the
# one before it, since a minute here is counted and a macOS one as ten.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'license', '.github/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'license', '.github/**']

# a release is made, and files are attached to it
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: x86_64
            runner: ubuntu-latest
          - processor: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZIG_VERSION: 0.16.0
      PROCESSOR: ${{ matrix.processor }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${PROCESSOR}-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "$HOME/tools/zig-${PROCESSOR}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # every case once, and then the packages of this target, which say that it ran
      - name: Build, test and package
        run: python3 build.py package

      # each case six times at once, once: what a case alone does not find -
      # docs/plan/stage13.md, *Under load*. It was ten times over, and nine tenths of the run
      - name: Under load
        run: python3 build.py test --copies 6

      # what a host is handed, attached to the release of this commit. The first job to pass
      # makes the release, and a job that fails attaches nothing, so one may lack a target
      - name: Publish
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA::12}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" \
            --prerelease --title "main at ${GITHUB_SHA::12}" \
            --notes "The packages of Bridge at this commit, for each target whose job passed. Each states itself in package.txt." \
            || gh release view "$tag" >/dev/null
          gh release upload "$tag" build/*/packages/*.tar.gz --clobber
