# The Linux build, on every push, on each processor there is a target for: the half of every
# stage's claim a Windows machine cannot check. The tools are the ones the build asks for, at the
# versions every other run uses - docs/design/dependencies.md.
name: linux

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: x86_64
            runner: ubuntu-latest
          - processor: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ZIG_VERSION: 0.16.0
      BINARYEN_VERSION: 133
      PROCESSOR: ${{ matrix.processor }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${PROCESSOR}-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-${PROCESSOR}-linux.tar.gz" | tar -xz
          echo "$HOME/tools/zig-${PROCESSOR}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          echo "BINARYEN_ROOT=$HOME/tools/binaryen-version_${BINARYEN_VERSION}" >> "$GITHUB_ENV"

      - name: Build and test
        run: python3 build.py test
