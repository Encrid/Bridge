# The macOS build, on each processor there is a target for. The tools are the ones
# the build asks for, at the versions every other run uses - docs/design/dependencies.md.
# Binaryen names its arm64 archive `arm64`, and zig names the same processor `aarch64`.
name: macos

# It runs for what reaches dev and main, and for a pull request: a stage's branch is held by
# the cases run where it is written. A change to documents alone starts nothing, and a newer
# push stops the run of the one before it, since a minute here is counted and a macOS one as
# ten.
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**.md', 'license']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'license']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: aarch64
            binaryen: arm64
            runner: macos-latest
          - processor: x86_64
            binaryen: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZIG_VERSION: 0.16.0
      BINARYEN_VERSION: 133
      PROCESSOR: ${{ matrix.processor }}
      BINARYEN_PROCESSOR: ${{ matrix.binaryen }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${PROCESSOR}-macos-${ZIG_VERSION}.tar.xz" | tar -xJ
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-${BINARYEN_PROCESSOR}-macos.tar.gz" | tar -xz
          echo "$HOME/tools/zig-${PROCESSOR}-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          echo "BINARYEN_ROOT=$HOME/tools/binaryen-version_${BINARYEN_VERSION}" >> "$GITHUB_ENV"

      - name: Build and test
        run: python3 build.py test

      # each case six times at once, ten times over: what a case alone does not find -
      # docs/plan/stage13.md, *Under load*
      - name: Under load
        run: python3 build.py test --copies 6 --rounds 10
