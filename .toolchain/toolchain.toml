[zig]
version = "0.17.1"
folder = "build/zig"
url = "https://ziglang.org/download/{version}/zig-{host}-{version}.{format}"

[zig.archives]
x86_64-windows-gnu = { host = "x86_64-windows", format = "zip", sha256 = "b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e" }
x86_64-linux-gnu = { host = "x86_64-linux", format = "tar.xz", sha256 = "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a" }
aarch64-macos = { host = "aarch64-macos", format = "tar.xz", sha256 = "75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d" }
aarch64-linux-gnu = { host = "aarch64-linux", format = "tar.xz", sha256 = "a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795" }
x86_64-macos = { host = "x86_64-macos", format = "tar.xz", sha256 = "9af07b20319fbd0c92ee46ad23e81d6a782b1aaea2cfb8dcbff35f1d2c7ddbb7" }
aarch64-windows-gnu = { host = "aarch64-windows", format = "zip", sha256 = "4789895bdb1e312a2ea73b2a7c0a0cc8d2ab62ba6976e834a7c54cf443377c15" }

[build]
folder = "build"
cache = "build/zig-cache"

[variables]
language = ["-std=c23", "-pedantic-errors", "-Wall", "-Wextra", "-Werror"]
optimize = ["-O2", "-DNDEBUG", "-g0", "-s", "-fno-sanitize=undefined", "-fno-stack-protector", "-fno-omit-frame-pointer"]
float = ["-ffp-contract=on", "-fno-fast-math", "-fno-rounding-math"]
strip = "-fstrip"

[debug]
optimize = ["-O0", "-g", "-fsanitize=undefined", "-fno-sanitize=vptr", "-fno-sanitize=function", "-fstack-protector-strong", "-fno-omit-frame-pointer"]
strip = "-fno-strip"

[targets.x86_64-windows-gnu]
runs_on = ["Windows", "AMD64"]
system = "windows"
triple = "x86_64-windows.win10...win11_dt-gnu"
cpu = "x86_64"
exe = ".exe"
library = ".dll"
define = []
pic = []
rpath = []
soname = []
stack = "-Wl,--stack,16777216"
errno = "-fmath-errno"
runtime = ["{toolchain}/runtime/windows_x86_64_move.c", "{toolchain}/runtime/windows_x86_64_fill.c", "{toolchain}/runtime/windows_x86_64_compare.c", "{toolchain}/runtime/windows_x86_64_stack.c"]

[targets.x86_64-linux-gnu]
runs_on = ["Linux", "x86_64"]
system = "posix"
triple = "x86_64-linux.5.10.0...6.19.0-gnu.2.31.0"
cpu = "x86_64"
exe = ""
library = ".so"
define = ["-D_DEFAULT_SOURCE"]
pic = ["-fPIC"]
rpath = ["-Wl,-rpath,$ORIGIN"]
soname = ["-Wl,-soname,{name}{library}"]
stack = "-Wl,-z,stack-size=16777216"
errno = "-fmath-errno"
runtime = []

[targets.aarch64-macos]
runs_on = ["Darwin", "arm64"]
system = "posix"
triple = "aarch64-macos.13.0.0...15.6.0"
cpu = "apple_m1"
exe = ""
library = ".dylib"
define = []
pic = ["-fPIC"]
rpath = ["-Wl,-rpath,@loader_path"]
soname = ["-Wl,-install_name,@rpath/{name}{library}"]
stack = "-Wl,-stack_size,16777216"
errno = "-fno-math-errno"
runtime = []

[targets.aarch64-linux-gnu]
runs_on = ["Linux", "aarch64"]
system = "posix"
triple = "aarch64-linux.5.10.0...6.19.0-gnu.2.31.0"
cpu = "generic"
exe = ""
library = ".so"
define = ["-D_DEFAULT_SOURCE"]
pic = ["-fPIC"]
rpath = ["-Wl,-rpath,$ORIGIN"]
soname = ["-Wl,-soname,{name}{library}"]
stack = "-Wl,-z,stack-size=16777216"
errno = "-fmath-errno"
runtime = []

[targets.x86_64-macos]
runs_on = ["Darwin", "x86_64"]
system = "posix"
triple = "x86_64-macos.13.0.0...15.6.0"
cpu = "core2"
exe = ""
library = ".dylib"
define = []
pic = ["-fPIC"]
rpath = ["-Wl,-rpath,@loader_path"]
soname = ["-Wl,-install_name,@rpath/{name}{library}"]
stack = "-Wl,-stack_size,16777216"
errno = "-fno-math-errno"
runtime = []

[targets.aarch64-windows-gnu]
runs_on = ["Windows", "ARM64"]
system = "windows"
triple = "aarch64-windows.win10...win11_dt-gnu"
cpu = "generic"
exe = ".exe"
library = ".dll"
define = []
pic = []
rpath = []
soname = []
stack = "-Wl,--stack,16777216"
errno = "-fmath-errno"
runtime = []

[kinds.program]
output = "{name}{exe}"
each = { run = ["{zig}", "cc", "-c", "-target", "{triple}", "-mcpu={cpu}", "{optimize}", "{float}", "{errno}", "{language}", "-Wno-unused-command-line-argument", "{define}", "{defines}", "{include}", "{inputs}", "{flags}", "{source}", "-MD", "-MF", "{deps}", "-o", "{object}"] }
steps = [
    { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{optimize}", "{float}", "{errno}", "{language}", "-Wno-unused-command-line-argument", "{objects}", "{link}", "{flags}", "{rpath}", "-o", "{output}", "{stack}"] },
]

[kinds.library]
output = "{name}{library}"
each = { run = ["{zig}", "cc", "-c", "-target", "{triple}", "-mcpu={cpu}", "{pic}", "{optimize}", "{float}", "{errno}", "{language}", "-Wno-unused-command-line-argument", "{define}", "{defines}", "{include}", "{inputs}", "{flags}", "{source}", "-MD", "-MF", "{deps}", "-o", "{object}"] }
steps = [
    { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "-shared", "{pic}", "{soname}", "{optimize}", "{float}", "{errno}", "{language}", "-Wno-unused-command-line-argument", "{define}", "{defines}", "{include}", "{inputs}", "{objects}", "{runtime}", "{link}", "{flags}", "-o", "{output}"] },
]

[kinds.archive]
output = "{name}.a"
each = { run = ["{zig}", "cc", "-c", "-target", "{triple}", "-mcpu={cpu}", "{optimize}", "{float}", "{errno}", "{language}", "-Wno-unused-command-line-argument", "{define}", "{defines}", "{include}", "{inputs}", "{flags}", "{source}", "-MD", "-MF", "{deps}", "-o", "{object}"] }
steps = [
    { run = ["{zig}", "build-lib", "-static", "-target", "{triple}", "-mcpu={cpu}", "{strip}", "-femit-bin={output}", "{objects}"] },
]

[kinds.file]
output = "{name}"
steps = [
    { copy = ["{sources}", "{output}"] },
]

[rewrite]
dump =["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{optimize}", "{float}", "{errno}", "{language}", "-Wno-unused-command-line-argument", "{define}", "{defines}", "{include}", "{inputs}", "{flags}", "-U_FORTIFY_SOURCE", "-D_FORTIFY_SOURCE=0", "-fsyntax-only", "-Xclang", "-ast-dump=json", "-o", "{work}.dump", "{source}"]

[style]
columns = 80
lines = 20
functions = 5
arguments = 4
branches = 3
depth = 2

[prose]
tags = ["pseudo", "c", "cpp", "toml", "sh", "text", "mermaid"]
sentence = 25
step = 20
paragraph = 6
description = 119

[dup]
words = 8

[said]
own = 6

[commits]
types = ["feat", "fix", "refactor", "chore", "docs", "test", "build", "perf", "style", "ci", "revert"]
words = 20

