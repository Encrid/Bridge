[project]
name = "taken"

[variables]
sample = "sample"
made = "sample"
maybe = "nothing"

[[dependency]]
name = "sample"
from = "{root}/{sample}"
list = "package.txt"
into = "{build}/taken/sample"

[[dependency]]
name = "made"
make = ["{python}", "-c", "import shutil, sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)", "{root}/{made}", "{build}/made"]
from = "{build}/made"
list = "package.txt"
into = "{build}/taken/made"

[[dependency]]
name = "maybe"
from = "{root}/{maybe}"
list = "package.txt"
into = "{build}/taken/maybe"
optional = true

[[agree]]
keys = ["sample.package", "made.package", "maybe.package"]
length = 6
