[project]
name = "opened"

[targets.x86_64-windows-gnu]
dl = []

[targets.aarch64-windows-gnu]
dl = []

[targets.x86_64-linux-gnu]
dl = ["-ldl"]

[targets.aarch64-linux-gnu]
dl = ["-ldl"]

[targets.x86_64-macos]
dl = []

[targets.aarch64-macos]
dl = []

[[artifact]]
name = "chunk"
kind = "library"
folder = "built"
path = true
sources = ["src/chunk.c"]

[[artifact]]
name = "loader"
kind = "program"
test = true
sources = ["tests/loader.c"]
defines = ["{paths}"]
flags = ["{dl}"]

[test]
timeout = 60
copies = 1
