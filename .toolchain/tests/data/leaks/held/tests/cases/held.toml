[[case]]
name = "whole"
run = ["{out}/held{exe}"]
claims = { status = 0, line = ["whole"] }
false = { run = ["{out}/held{exe}", "kept"] }

[[case]]
name = "kept"
run = ["{out}/held{exe}", "kept"]
