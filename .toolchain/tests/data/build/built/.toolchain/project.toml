[project]
name = "built"

[variables]
said = "written"
outside = "{root}/tests/package/outside.c"
outside_include = "{root}/tests/package/include"

[package]
proof = "tests/package/host.c"
link = ["{outside}"]
include = ["{outside_include}"]

[compose.base]
headers = ["include/**/*.h"]

[kinds.stamped]
output = "{name}.txt"
steps = [
    { copy = ["{sources}", "{work}.txt"] },
    { rename = ["{work}.txt", "{output}"] },
    { section = "said", text = "{manifest:,}" },
    { contains = "{said}" },
]

[[artifact]]
name = "greet"
kind = "library"
sources = ["src/greet.c"]
include = ["include"]
defines = ['GREETING="hello from a library"']

[[artifact]]
name = "greet_static"
kind = "archive"
sources = ["src/greet.c"]
include = ["include"]
flags = ['-DGREETING="hello from an archive"']

[[artifact]]
name = "greeter_static"
kind = "program"
folder = "greeter_static"
test = true
sources = ["src/greeter.c", "src/{system}/*.c"]
include = ["include", "src"]
link = ["{out}/greet_static.a"]

[[artifact]]
name = "greeter"
kind = "program"
folder = "greeter"
sources = ["src/greeter.c", "src/{system}/*.c"]
include = ["include", "src"]
link = ["{out}/greet{library}"]
beside = ["{out}/greet{library}"]

[[artifact]]
name = "stamped"
kind = "stamped"
part = "extra"
sources = ["src/note.txt"]
manifest = ["first", "second"]
variants = [{ name = "plain", unstamped = true }]

[test]
timeout = 60
copies = 1
