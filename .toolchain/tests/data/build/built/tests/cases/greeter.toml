[[case]]
name = "greeter"
run = ["{out}/greeter/greeter{exe}"]
claims = { status = 0, line = ["hello from a library, on {system}"] }
false = { run = ["{case}/alone/greeter{exe}"], folders = { "{case}/alone" = ["greeter"] } }

[[case]]
name = "greeter_static"
run = ["{out}/greeter_static/greeter_static{exe}"]
claims = { status = 0, line = ["hello from an archive, on {system}"] }
false = { run = ["{out}/greeter/greeter{exe}"] }
