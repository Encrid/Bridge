[[case]]
name = "clean keeps the sources"
run = ["{python}", "-c", "import os, subprocess, sys; subprocess.run([sys.executable, sys.argv[1], '--root', sys.argv[2]] + sys.argv[3:]); print('\\n'.join(sorted(os.path.relpath(os.path.join(d, f), sys.argv[2]).replace(os.sep, '/') for d, _, fs in os.walk(sys.argv[2]) for f in fs)))", "{root}/.toolchain/tools/clean.py", "{case}/p"]
claims = { status = 0, line = ["build/third_party/s/fetched.txt", ".toolchain/project.toml"], lacks = ["a.txt", "p-x.zip"] }
false = { run = ["{python}", "-c", "import os, subprocess, sys; subprocess.run([sys.executable, sys.argv[1], '--root', sys.argv[2]] + sys.argv[3:]); print('\\n'.join(sorted(os.path.relpath(os.path.join(d, f), sys.argv[2]).replace(os.sep, '/') for d, _, fs in os.walk(sys.argv[2]) for f in fs)))", "{root}/.toolchain/tools/clean.py", "{case}/p", "--all"] }

[case.files]
"{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n\n[[source]]\nname = \"s\"\nurl = \"s.zip\"\nsha256 = \"0\"\ninto = \"build/third_party/s\"\n"
"{case}/p/build/x/a.txt" = "a"
"{case}/p/build/p-x.zip" = "z"
"{case}/p/build/third_party/s/fetched.txt" = "0"

[[case]]
name = "distclean removes the folder build"
run = ["{python}", "-c", "import os, subprocess, sys; subprocess.run([sys.executable, sys.argv[1], '--root', sys.argv[2]] + sys.argv[3:]); print('\\n'.join(sorted(os.path.relpath(os.path.join(d, f), sys.argv[2]).replace(os.sep, '/') for d, _, fs in os.walk(sys.argv[2]) for f in fs)))", "{root}/.toolchain/tools/clean.py", "{case}/p", "--all"]
claims = { status = 0, line = [".toolchain/project.toml"], lacks = ["build/x/a.txt", "build/third_party/s/fetched.txt"] }
false = { run = ["{python}", "-c", "import os, subprocess, sys; subprocess.run([sys.executable, sys.argv[1], '--root', sys.argv[2]] + sys.argv[3:]); print('\\n'.join(sorted(os.path.relpath(os.path.join(d, f), sys.argv[2]).replace(os.sep, '/') for d, _, fs in os.walk(sys.argv[2]) for f in fs)))", "{root}/.toolchain/tools/clean.py", "{case}/p"] }

[case.files]
"{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n\n[[source]]\nname = \"s\"\nurl = \"s.zip\"\nsha256 = \"0\"\ninto = \"build/third_party/s\"\n"
"{case}/p/build/x/a.txt" = "a"
"{case}/p/build/third_party/s/fetched.txt" = "0"

[[case]]
name = "nothing to clean"
run = ["{python}", "{root}/.toolchain/tools/clean.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n" }
claims = { status = 0, has = ["nothing to clean"] }
false = { files = { "{case}/p/build/a.txt" = "a" } }
