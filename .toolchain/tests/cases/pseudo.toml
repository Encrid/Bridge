[[case]]
name = "the example of the profile"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
folders = { "{case}/docs" = [".toolchain/docs/pseudo.py.md"] }
claims = { status = 0, line = ["no fault in 1 files"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx := 1\n```\n" } }

[[case]]
name = "a comment"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx <- 1 // one\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses comments"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx <- 1\n```\n" } }

[[case]]
name = "the arrow of the guide"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx \u2190 1\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses the arrow of the guide: write <-"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx <- 1\n```\n" } }

[[case]]
name = "an assignment with :="
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx := 1\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses :=, write <-"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx <- 1\n```\n" } }

[[case]]
name = "file handling"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nOPENFILE \"a.txt\" FOR READ\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses file handling"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nCALL open(\"a.txt\")\n```\n" } }

[[case]]
name = "a class"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nCLASS pet\nENDCLASS\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses classes and objects"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nTYPE pet_t\nENDTYPE\n```\n" } }

[[case]]
name = "an input"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nINPUT x\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses input and output"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx <- 1\n```\n" } }

[[case]]
name = "an output"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nOUTPUT x\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the profile refuses input and output"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nCALL show(x)\n```\n" } }

[[case]]
name = "an indentation of two spaces"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n  x <- 1\nENDIF\n```\n" }
claims = { status = 1, line = ["docs/a.md:5: indented by 2, and its level needs 3"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n   x <- 1\nENDIF\n```\n" } }

[[case]]
name = "a keyword in lower case"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nif x > 0 THEN\n   x <- 1\nENDIF\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the keyword if is not in upper case"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n   x <- 1\nENDIF\n```\n" } }

[[case]]
name = "a line of no form"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx = 1\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: not a line of the profile"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nx <- 1\n```\n" } }

[[case]]
name = "a type in lower case"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nDECLARE x : integer\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: the keyword integer is not in upper case"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nDECLARE x : INTEGER\n```\n" } }

[[case]]
name = "a TYPE with an assignment"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nTYPE a_t\n   x <- 1\nENDTYPE\n```\n" }
claims = { status = 1, line = ["docs/a.md:5: a TYPE holds only DECLARE lines"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nTYPE a_t\n   DECLARE x : INTEGER\nENDTYPE\n```\n" } }

[[case]]
name = "a clause after OTHERWISE"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nCASE OF x\n   1 : y <- 1\n   OTHERWISE : y <- 0\n   2 : y <- 2\nENDCASE\n```\n" }
claims = { status = 1, line = ["docs/a.md:7: a clause after OTHERWISE"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nCASE OF x\n   1 : y <- 1\n   2 : y <- 2\n   OTHERWISE : y <- 0\nENDCASE\n```\n" } }

[[case]]
name = "an end that does not match"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n   x <- 1\nENDWHILE\n```\n" }
claims = { status = 1, line = ["docs/a.md:6: ENDWHILE does not match the open block: IF"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n   x <- 1\nENDIF\n```\n" } }

[[case]]
name = "NEXT with a different name"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nFOR i <- 1 TO 3\n   x <- i\nNEXT j\n```\n" }
claims = { status = 1, line = ["docs/a.md:6: NEXT j does not match the open block: FOR"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nFOR i <- 1 TO 3\n   x <- i\nNEXT i\n```\n" } }

[[case]]
name = "an end with no block"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nENDIF\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: ENDIF does not match the open block: none"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\nENDIF\n```\n" } }

[[case]]
name = "a block that is not closed"
run = ["{python}", "{root}/.toolchain/tools/pseudo.py", "--root", "{case}"]
files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n   x <- 1\n```\n" }
claims = { status = 1, line = ["docs/a.md:4: IF is not closed"] }
false = { files = { "{case}/docs/a.md" = "# a\n\n```pseudo\nIF x > 0 THEN\n   x <- 1\nENDIF\n```\n" } }
