[[case]]
name = "branches that no case reaches"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/missed", "--out", "{case}/out", "--branches"]
claims = { status = 1, line = ["src/branchy.c:13:5: no case calls this function", "src/branchy.c:24:9: no case reaches this case", "src/branchy.c:34:17: no case makes this condition false", "src/branchy.c:38:22: no case makes this condition true", "src/branchy.c:40:9: this condition is in a macro, and is not measured", "src/branchy.h:11:9: no case makes this condition true", "branches: 17 outcomes, 9 reached"], has = ["outcomes not reached: 8; branches not measured: 1"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/reached", "--out", "{case}/out", "--branches"] }

[[case]]
name = "each branch reached"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/reached", "--out", "{case}/out", "--branches"]
claims = { status = 0, line = ["branches: 16 outcomes, 16 reached"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/missed", "--out", "{case}/out", "--branches"] }

[[case]]
name = "branches of a project with no source"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/empty", "--out", "{case}/out", "--branches"]
claims = { status = 0, line = ["branches: 0 outcomes, 0 reached"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/reached", "--out", "{case}/out", "--branches"] }

[[case]]
name = "branches with a false variant"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/empty", "--out", "{case}/out", "--branches", "--break"]
claims = { status_not = 0, has = ["--branches runs each case one time: it takes no --break, --toolchain, --copies or --rounds"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/empty", "--out", "{case}/out", "--branches"] }

[[case]]
name = "an exemption excuses an unreached branch"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/excused", "--out", "{case}/out", "--branches"]
claims = { status = 0, line = ["branches: 4 outcomes, 3 reached, 1 exempt"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/badexempt", "--out", "{case}/out", "--branches"] }

[[case]]
name = "an exemption for a different system does not apply"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/systemed", "--out", "{case}/out", "--branches"]
claims = { status = 1, line = ["src/defend.c:10:9: no case makes this condition true"], lacks = ["excuses no unreached outcome"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/excused", "--out", "{case}/out", "--branches"] }

[[case]]
name = "an exemption with no reason or no target is a fault"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/badexempt", "--out", "{case}/out", "--branches"]
claims = { status = 1, line = ["src/defend.c:10:9: no case makes this condition true", "src/defend.c:10:9: this exemption states no reason", "src/defend.c:12:9: this exemption excuses no unreached outcome"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/excused", "--out", "{case}/out", "--branches"] }

[[case]]
name = "a closed library keeps its outcomes"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/loaded", "--out", "{case}/out", "--branches"]
claims = { status = 0, line = ["branches: 3 outcomes, 3 reached"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/branches/loaded", "--out", "{case}/out", "--branches", "-k", "one"] }
