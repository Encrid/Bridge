run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/include/sample.h" = "enum sample_kind : int {\n    SAMPLE_ONE,\n    SAMPLE_TWO\n};\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_ONE` is one.\n" }
claims = { status_not = 0, has = ["include/sample.h: SAMPLE_TWO is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_ONE` is one, and `SAMPLE_TWO` is two.\n" } }

