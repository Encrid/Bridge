[[case]]
name = "a function that its document does not name"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/include/sample.h" = "int sample_add(int a, int b);\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n" }
claims = { status_not = 0, has = ["include/sample.h: sample_add is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`sample_add(a, b)` gives the sum.\n" } }

[[case]]
name = "a function with an attribute"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/include/sample.h" = "[[nodiscard]] int sample_add(int a, int b);\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n" }
claims = { status_not = 0, has = ["include/sample.h: sample_add is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`sample_add(a, b)` gives the sum.\n" } }

[[case]]
name = "a function static inline"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/include/sample.h" = "static inline int sample_twice(int a)\n{\n    return (a * 2);\n}\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n" }
claims = { status_not = 0, has = ["include/sample.h: sample_twice is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`sample_twice(a)` doubles.\n" } }

[[case]]
name = "a macro with arguments"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/include/sample.h" = "#define SAMPLE_MAX(a, b) ((a) > (b) ? (a) : (b))\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n" }
claims = { status_not = 0, has = ["include/sample.h: SAMPLE_MAX is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_MAX(a, b)` gives the larger.\n" } }

[[case]]
