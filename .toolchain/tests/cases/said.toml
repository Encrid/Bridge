false = { files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"puts\"]\n" } }

[[case]]
name = "no output of the cases"
run = ["{python}", "{root}/.toolchain/tools/said.py", "--root", "{case}/p", "--out", "{case}/out"]
files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"the file %s is not there\\n\", path);\n", "{case}/p/readme.md" = "# p\n\n`the file <path> is not there`\n" }
claims = { status_not = 0, has = ["said.txt is not there: run test first"] }
false = { files = { "{case}/out/{target}/scratch/said.txt" = "the file a.txt is not there\n" } }

[[case]]
name = "the messages after the cases"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}/p", "--out", "{case}/out"]
folders = { "{case}/p/tests/cases" = [".toolchain/tests/data/said/said.toml"] }
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"said\"\n\n[test]\ntimeout = 60\ncopies = 1\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"the file %s is not there\\n\", path);\n", "{case}/p/readme.md" = "# p\n\n`the file <path> is not there`\n" }
claims = { status = 0, line = ["no fault in 1 messages"] }
false = { files = { "{case}/p/readme.md" = "# p\n" } }
