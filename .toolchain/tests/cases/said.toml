[[case]]
name = "a message that no case wrote"
run = ["{python}", "{root}/.toolchain/tools/said.py", "--root", "{case}/p", "--out", "{case}/out"]
files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"the file %s is not there\\n\", path);\n", "{case}/out/{target}/scratch/said.txt" = "something else\n", "{case}/p/readme.md" = "# p\n\n`the file <path> is not there`\n" }
claims = { status_not = 0, has = ["src/p.c:1: no case wrote: the file %s is not there"] }
false = { files = { "{case}/out/{target}/scratch/said.txt" = "the file a.txt is not there\n" } }

[[case]]
name = "a message that no document quotes"
run = ["{python}", "{root}/.toolchain/tools/said.py", "--root", "{case}/p", "--out", "{case}/out"]
files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"the file %s is not there\\n\", path);\n", "{case}/out/{target}/scratch/said.txt" = "the file a.txt is not there\n", "{case}/p/readme.md" = "# p\n" }
claims = { status_not = 0, has = ["src/p.c:1: no document quotes: the file %s is not there"] }
false = { files = { "{case}/p/readme.md" = "# p\n\n`the file <path> is not there`\n" } }

[[case]]
name = "a message that a document of docs/extern quotes"
run = ["{python}", "{root}/.toolchain/tools/said.py", "--root", "{case}/p", "--out", "{case}/out"]
files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"the file %s is not there\\n\", path);\n", "{case}/out/{target}/scratch/said.txt" = "the file a.txt is not there\n", "{case}/p/docs/extern/p.md" = "# p\n\n`the file <path> is not there`\n" }
claims = { status = 0 }
false = { files = { "{case}/p/docs/extern/p.md" = "# p\n\n`the file is there`\n" } }

[[case]]
name = "a format in two strings"
run = ["{python}", "{root}/.toolchain/tools/said.py", "--root", "{case}/p", "--out", "{case}/out"]
files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"the file \" \"%s is gone\\n\", name(path));\n", "{case}/out/{target}/scratch/said.txt" = "the file a.txt is there\n", "{case}/p/readme.md" = "# p\n\n`the file <path> is gone`\n" }
claims = { status_not = 0, has = ["src/p.c:1: no case wrote: the file %s is gone"] }
false = { files = { "{case}/out/{target}/scratch/said.txt" = "the file a.txt is gone\n" } }

[[case]]
name = "a format with few own characters"
run = ["{python}", "{root}/.toolchain/tools/said.py", "--root", "{case}/p", "--out", "{case}/out"]
files = { "{case}/p/.toolchain/project.toml" = "[test]\nwriters = [\"say\"]\n", "{case}/p/src/p.c" = "say(\"%s\\n\", text);\n", "{case}/out/{target}/scratch/said.txt" = "", "{case}/p/readme.md" = "# p\n" }
claims = { status = 0 }
false = { files = { "{case}/p/src/p.c" = "say(\"%s is gone\\n\", text);\n" } }

[[case]]
