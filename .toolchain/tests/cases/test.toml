false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--part", "alpha"] }

[[case]]
name = "a project with no copies"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/nocopies/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] }
