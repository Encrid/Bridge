[[case]]
name = "a script"
run = ["{python}", "-c", "import sys; print('? name', flush=True); print('hello, ' + input()); print(open(sys.argv[1]).read())", "{case}/note.txt"]
script = [{ wait = "? name", put = { "{case}/note.txt" = ".toolchain/tests/data/test/note.txt" }, type = "you" }]
claims = { status = 0, order = ["hello, you", "written at the prompt"], files = { "{case}/note.txt" = "written at the prompt" } }
false = { script = [{ wait = "? name", type = "nobody" }] }

[[case]]
name = "a helper"
run = ["{python}", "-c", "import sys; print(open(sys.argv[1]).read())", "{case}/said.txt"]
helper = { run = ["{python}", "-c", "import sys; open(sys.argv[1], 'w').write('hello, helper'); print('written', flush=True); input()", "{case}/said.txt"], wait = "written", stdin = "\n", claims = { status = 0 } }
claims = { status = 0, line = ["hello, helper"] }
false = { helper = {} }

[[case]]
name = "a variable of the environment, given"
run = ["{python}", "-c", "import os, sys; print(os.environ.get(sys.argv[1], 'unset'))", "C23_SAID"]
env = { C23_SAID = "port {port}" }
claims = { status = 0, line = ["port {port}"] }
false = { env = {} }

[[case]]
name = "a variable of the environment, taken away"
run = ["{python}", "-c", "import os, sys; print(os.environ.get(sys.argv[1], 'unset'))", "ZIG_LOCAL_CACHE_DIR"]
env = { ZIG_LOCAL_CACHE_DIR = false }
claims = { status = 0, line = ["unset"] }
false = { env = {} }

[[case]]
name = "claims on the status and on the output"
run = ["{python}", "-c", "import sys; print('one ' + input()); sys.exit(3)"]
stdin = "two\n"
claims = { status = 3, status_not = 0, has = ["one two"], lacks = ["three"] }
false = { stdin = "three\n" }

[[case]]
name = "a script that removes a file"
run = ["{python}", "-c", "import os, sys; print('? gone', flush=True); input(); print(os.path.exists(sys.argv[1]))", "{case}/gone.txt"]
files = { "{case}/gone.txt" = "here" }
script = [{ wait = "? gone", remove = ["{case}/gone.txt"], type = "go" }]
claims = { status = 0, line = ["False"] }
false = { script = [{ wait = "? gone", type = "go" }] }

[[case]]
name = "a folder of files"
run = ["{python}", "-c", "import sys; print(open(sys.argv[1]).read())", "{case}/in/note.txt"]
folders = { "{case}/in" = [".toolchain/tests/data/test/note.txt"] }
claims = { status = 0, line = ["written at the prompt"] }
false = { folders = { "{case}/in" = [] } }

[[case]]
name = "a case with no false variant"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/alone.toml"] }
claims = { status_not = 0, has = ["tests/cases/alone.toml: the case alone has no false variant"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a case that claims nothing"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/silent.toml"] }
claims = { status_not = 0, has = ["tests/cases/silent.toml: the case silent claims nothing"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a case with a key that no case has"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/colour.toml"] }
claims = { status_not = 0, has = ["tests/cases/colour.toml: a case has no key colour"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a case that differs"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/fails.toml"] }
claims = { status_not = 0, has = ["fails: differs", "  ended with 1 (0x00000001), and printed:", "not as written: fails"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a case that does not end in time"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/late/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/late.toml"] }
claims = { status_not = 0, has = ["late: did not end in 2 seconds", "not as written: late"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a rule of the tests"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/ruled/project.toml"], "{case}/tests/cases/free" = [".toolchain/tests/data/test/said.toml"], "{case}/tests/cases/held" = [".toolchain/tests/data/test/said.toml"] }
claims = { status_not = 0, has = ["free/said: 1 cases: 1 as written", "held/said: 1 cases: 0 as written"] }
false = { folders = { "{case}/tests/cases/held" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "no case"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"] }
claims = { status = 0, line = ["no case: tests/cases holds no case"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a false variant that still holds"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--break"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/still.toml"] }
claims = { status_not = 0, has = ["still as written with their claims made false: still"] }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] } }

[[case]]
name = "a target that does not run here"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--target", "nowhere"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/nowhere/project.toml"] }
claims = { status_not = 0, has = ["nowhere does not run here: build it, and test it where it runs"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"] }

[[case]]
name = "a case that needs what is not linked"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/later/project.toml"] }
claims = { status_not = 0, has = ["compiled, not linked: later: ", "the cases need what is linked: later"] }
false = { files = { "{case}/linked.txt" = "here" } }

[[case]]
name = "the output of the cases"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/said.toml"] }
claims = { status = 0, files = { "{case}/out/{target}/scratch/said.txt" = "ended after" } }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--break"] }

[[case]]
name = "a claim of a pattern"
run = ["{python}", "-c", "print('first line'); print('second: 42')"]
claims = { status = 0, matches = ["first.*second: \\d+"] }
false = { run = ["{python}", "-c", "print('second: 42'); print('first line')"] }

[[case]]
name = "a claim of a pattern that is not found"
run = ["{python}", "-c", "print('hop A'); print('hop B')"]
claims = { status = 0, matches_not = ["hop A.*hop A"] }
false = { run = ["{python}", "-c", "print('hop A'); print('hop A')"] }

[[case]]
name = "a claim of the whole output"
run = ["{python}", "-c", "print('one'); print('two')"]
claims = { status = 0, output = ".toolchain/tests/data/test/output.txt" }
false = { run = ["{python}", "-c", "print('one')"] }

[[case]]
name = "copies of a case"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--copies", "3"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/ran.toml"] }
claims = { status = 0, files = { "{case}/out/{target}/scratch/cases/ran/0/2/ran.txt" = "ran" } }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"] }

[[case]]
name = "a case that runs alone"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--copies", "3"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/lone.toml"] }
claims = { status = 0, files = { "{case}/out/{target}/scratch/cases/lone/0/ran.txt" = "ran" } }
false = { folders = { "{case}/tests/cases" = [".toolchain/tests/data/test/ran.toml"] } }

[[case]]
name = "copies that differ"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--copies", "2"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/fails.toml"] }
claims = { status_not = 0, has = ["fails: differs in 2 of 2 copies"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"] }

[[case]]
name = "rounds of the cases"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--rounds", "2"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/passes.toml"] }
claims = { status = 0, line = ["round 2 of 2"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out"] }

[[case]]
name = "the cases of a part of a name"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{case}", "--out", "{case}/out", "-k", "second"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/test/project.toml"], "{case}/tests/cases" = [".toolchain/tests/data/test/two.toml"] }
