[[case]]
name = "a message with a body"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum\n\nThe sum was wrong.", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"]
claims = { status_not = 0, has = ["the message has more than 1 line"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a line of a different form"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "Correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"]
claims = { status_not = 0, has = ["the line is not type(scope): description"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a type that is not in the list"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "feature: add the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"]
claims = { status_not = 0, has = ["the type feature is not in the list"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "feat: add the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a scope"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix(sum): correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"]
claims = { status = 0 }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix(the sum): correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a description with too many words"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: add one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"]
claims = { status_not = 0, has = ["the description has 21 words, and 20 is the most"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: add one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a range of commits"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "Correct the sum", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo", "--commits", "HEAD"]
claims = { status_not = 0, has = ["the line is not type(scope): description"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "Correct the sum", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a range that git does not know"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo", "--commits", "nowhere"]
claims = { status_not = 0, has = ["git log nowhere:"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo", "--commits", "HEAD"] }

[[case]]
name = "a folder with no repository"
run = ["{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/plain"]
files = { "{case}/plain/.toolchain/project.toml" = "" }
claims = { status = 0, line = ["no fault in 0 commits"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }

[[case]]
name = "a repository with no commit"
run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"]
claims = { status = 0, line = ["no fault in 0 commits"] }
false = { run = ["{python}", "{root}/.toolchain/tests/data/commits/commit.py", "{case}/repo", "fix: correct the sum", "--", "{python}", "{root}/.toolchain/tools/commits.py", "--root", "{case}/repo"] }
