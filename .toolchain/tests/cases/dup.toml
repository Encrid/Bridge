[[case]]
name = "a citation in 2 documents"
run = ["{python}", "{root}/.toolchain/tools/dup.py", "--root", "{case}/p"]
files = { "{case}/p/docs/a.md" = "# a\n\nRead `docs/c.md`, *The use of the tool in each case*.\n", "{case}/p/docs/b.md" = "# b\n\nRead `docs/c.md`, *The use of the tool in each case*.\n" }
claims = { status = 0, line = ["no fault in 2 documents"] }
false = { files = { "{case}/p/docs/a.md" = "# a\n\nRead docs/c.md, the use of the tool in each case.\n", "{case}/p/docs/b.md" = "# b\n\nRead docs/c.md, the use of the tool in each case.\n" } }

[[case]]
name = "a passage of 2 scopes"
run = ["{python}", "{root}/.toolchain/tools/dup.py", "--root", "{case}/p"]
files = { "{case}/p/docs/a.md" = "# a\n\nOne two three four five six seven eight.\n", "{case}/p/.toolchain/docs/b.md" = "# b\n\nOne two three four five six seven eight.\n" }
claims = { status = 0, line = ["no fault in 2 documents"] }
false = { files = { "{case}/p/docs/b.md" = "# b\n\nOne two three four five six seven eight.\n" } }

[[case]]
name = "the documents of this project"
run = ["{python}", "{root}/.toolchain/tools/dup.py", "--root", "{case}"]
claims = { status = 0, line = ["no fault in 32 documents"] }
false = { files = { "{case}/docs/a.md" = "# a\n\nThe false variant changes the command or its input.\n" } }

[case.folders]
"{case}" = ["readme.md"]
"{case}/docs/contributing" = ["docs/contributing/agreement.md", "docs/contributing/coding_style.md", "docs/contributing/commits.md", "docs/contributing/documentation_style.md", "docs/contributing/pull_request.md", "docs/contributing/tests.md"]
