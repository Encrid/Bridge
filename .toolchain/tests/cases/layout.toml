[[case]]
name = "a full project"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
claims = { status = 0, line = ["no fault in 34 files"] }
false = { files = { "{case}/project/notes.txt" = "" } }

[case.files]
"{case}/project/.github/workflows/ci.yml" = ""
"{case}/project/.github/workflows/release.yml" = ""
"{case}/project/.github/workflows/cla.yml" = ""
"{case}/project/.gitattributes" = ""
"{case}/project/.gitignore" = ""
"{case}/project/cla.md" = ""
"{case}/project/license" = ""
"{case}/project/project.py" = ""
"{case}/project/.toolchain/project.toml" = ""
"{case}/project/readme.md" = ""
"{case}/project/docs/contributing/agreement.md" = ""
"{case}/project/docs/contributing/coding_style.md" = ""
"{case}/project/docs/contributing/commits.md" = ""
"{case}/project/docs/contributing/documentation_style.md" = ""
"{case}/project/docs/contributing/pull_request.md" = ""
"{case}/project/docs/contributing/tests.md" = ""
"{case}/project/.toolchain/tools/check.py" = ""
"{case}/project/.toolchain/toolchain.toml" = ""
"{case}/project/.toolchain/header.txt" = ""
"{case}/project/.toolchain/docs/check.py.md" = ""
"{case}/project/.toolchain/tests/cases/Any Name.toml" = ""
"{case}/project/tools/release.py" = ""
"{case}/project/docs/tools/release.py.md" = "# tools/release.py\n"
"{case}/project/src/sample.c" = ""
"{case}/project/src/net/socket.c" = ""
"{case}/project/include/sample.h" = ""
"{case}/project/third_party/sample/fix.patch" = ""
"{case}/project/third_party/sample/license" = ""
"{case}/project/docs/intern/sample.c.md" = "# src/sample.c\n"
"{case}/project/docs/intern/net/socket.c.md" = "# src/net/socket.c\n"
"{case}/project/docs/extern/sample.h.md" = "# include/sample.h\n"
"{case}/project/include/.gitkeep" = ""
"{case}/project/src/.gitkeep" = ""
"{case}/project/docs/extern/.gitkeep" = ""
"{case}/project/docs/intern/.gitkeep" = ""
"{case}/project/tests/Any Name.txt" = ""

[[case]]
name = "a path that the layout does not allow"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/notes.txt" = "" }
claims = { status = 1, line = ["notes.txt: the layout does not allow this file"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "" } }

[[case]]
name = "a file that the layout needs"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "" }
claims = { status = 1, line = ["license: the layout needs this file"] }
false = { files = { "{case}/project/license" = "" } }

[[case]]
name = "the folder that the layout needs"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "" }
claims = { status = 1, line = [".toolchain/tools/: the layout needs this folder"], lacks = ["src/: the layout needs this folder"] }
false = { files = { "{case}/project/.toolchain/tools/a.py" = "" } }

[[case]]
name = "a source without its document"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/src/a.c" = "" }
claims = { status = 1, line = ["src/a.c: no document docs/intern/a.c.md"] }
false = { files = { "{case}/project/docs/intern/a.c.md" = "# src/a.c\n" } }

[[case]]
name = "a header without its document"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/include/a.h" = "" }
claims = { status = 1, line = ["include/a.h: no document docs/extern/a.h.md"] }
false = { files = { "{case}/project/docs/extern/a.h.md" = "# include/a.h\n" } }

[[case]]
name = "a document without its file"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/docs/intern/gone.c.md" = "# src/gone.c\n" }
claims = { status = 1, line = ["docs/intern/gone.c.md: no file has this document"] }
false = { files = { "{case}/project/src/gone.c" = "" } }

[[case]]
name = "a document in the wrong folder"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/src/a.c" = "", "{case}/project/docs/intern/a.c.md" = "# src/a.c\n", "{case}/project/docs/extern/a.c.md" = "# src/a.c\n" }
claims = { status = 1, line = ["docs/extern/a.c.md: no file has this document"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "", "{case}/fixed/src/a.c" = "", "{case}/fixed/docs/intern/a.c.md" = "# src/a.c\n" } }

[[case]]
name = "an extra document in docs"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/docs/contributing/notes.md" = "" }
claims = { status = 1, line = ["docs/contributing/notes.md: the layout does not allow this file"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "" } }

[[case]]
name = "the first line of a document"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/src/a.c" = "", "{case}/project/docs/intern/a.c.md" = "# a.c\n" }
claims = { status = 1, line = ["docs/intern/a.c.md: the first line is not # src/a.c"] }
false = { files = { "{case}/project/docs/intern/a.c.md" = "# src/a.c\n" } }

[[case]]
name = "a name that is not in snake_case"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/src/Notes.c" = "" }
claims = { status = 1, line = ["src/Notes.c: 'Notes.c' is not in snake_case"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "", "{case}/fixed/src/notes.c" = "" } }

[[case]]
name = "a compiled file"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/src/sample.o" = "" }
claims = { status = 1, line = ["src/sample.o: a compiled or temporary file"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "", "{case}/fixed/src/sample.c" = "" } }

[[case]]
name = "an empty folder"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/include/.gitkeep" = "", "{case}/project/src/.gitkeep" = "", "{case}/project/tools/.gitkeep" = "", "{case}/project/docs/extern/.gitkeep" = "", "{case}/project/docs/intern/.gitkeep" = "" }
claims = { status = 1, lacks = [".gitkeep"] }
false = { files = { "{case}/project/notes/.gitkeep" = "" } }

[[case]]
name = "a file of tests"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/tests/Any Name.txt" = "" }
claims = { status = 1, lacks = ["Any Name.txt"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "", "{case}/fixed/src/Any Name.txt" = "" } }

[[case]]
name = "a tool without its document"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/tools/a.py" = "" }
claims = { status = 1, line = ["tools/a.py: no document docs/tools/a.py.md"] }
false = { files = { "{case}/project/docs/tools/a.py.md" = "# tools/a.py\n" } }

[[case]]
name = "a document of a tool that is not there"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/docs/tools/gone.py.md" = "# tools/gone.py\n" }
claims = { status = 1, line = ["docs/tools/gone.py.md: no file has this document"] }
false = { files = { "{case}/project/tools/gone.py" = "" } }

[[case]]
name = "a guide that [check] guides names"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "[check]\nguides = [\"timings.md\"]\n", "{case}/project/docs/contributing/timings.md" = "" }
claims = { status = 1, lacks = ["docs/contributing/timings.md"] }
false = { files = { "{case}/project/.toolchain/project.toml" = "" } }

[[case]]
name = "third_party holds anything"
run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/.toolchain/project.toml" = "", "{case}/project/third_party/bridge/bridge-host.exe" = "" }
claims = { status = 1, lacks = ["bridge-host.exe"] }
false = { run = ["{python}", "{root}/.toolchain/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/.toolchain/project.toml" = "", "{case}/fixed/bridge/bridge-host.exe" = "" } }
