[[case]]
name = "the command fetch"
run = ["{python}", "{root}/project.py", "fetch", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, line = ["{zig}"] }
false = { run = ["{python}", "{root}/project.py", "build", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "the command build"
run = ["{python}", "{root}/project.py", "build", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, files = { "{case}/out/{target}/scratch/package.txt" = "package taken" } }
false = { run = ["{python}", "{root}/project.py", "fetch", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "the command pack"
run = ["{python}", "{root}/project.py", "pack", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, line = ["{case}/out/taken-{target}.zip"] }
false = { run = ["{python}", "{root}/project.py", "build", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "the command test"
run = ["{python}", "{root}/project.py", "test", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, line = ["no case: tests/cases holds no case"] }
false = { run = ["{python}", "{root}/project.py", "build", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "a command that project.py does not know"
run = ["{python}", "{root}/project.py", "nothing"]
claims = { status_not = 0, has = ["project.py: name a command: fetch build pack test check clean distclean cla"] }
false = { run = ["{python}", "{root}/project.py", "test", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "the exit status of a tool"
run = ["{python}", "{root}/project.py", "build", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--target", "nowhere"]
claims = { status_not = 0, has = ["build.py: no target nowhere"] }
false = { run = ["{python}", "{root}/project.py", "build", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }
