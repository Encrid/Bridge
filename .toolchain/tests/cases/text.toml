[[case]]
name = "files with no fault"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"], "{case}" = ["project.py"] }
files = { "{case}/a.toml" = "name = \"#1\"\n", "{case}/.github/workflows/ci.yml" = "name: \"#1\"\n", "{case}/docs/a.md" = "# a\n\nA text.\n" }
claims = { status = 0, line = ["no fault in 5 files"] }
false = { files = { "{case}/a.toml" = "name = \"1\" # one\n" } }

[[case]]
name = "a character that is not ASCII"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/docs/a.md" = "# a\n\nThe caf\u00e9.\n" }
claims = { status = 1, line = ["docs/a.md:3: a character that is not ASCII"] }
false = { files = { "{case}/docs/a.md" = "# a\n\nThe cafe.\n" } }

[[case]]
name = "a file that [check] unicode names"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/unicode/project.toml"] }
files = { "{case}/docs/a.md" = "# a\n\nThe caf\u00e9.\n" }
claims = { status = 0, line = ["no fault in 2 files"] }
false = { folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] } }

[[case]]
name = "a Python file without the legal notice"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/project.py" = "print(1)\n" }
claims = { status = 1, line = ["project.py:1: the file does not start with the legal notice"] }
false = { run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}/fixed"], folders = { "{case}/fixed/.toolchain" = [".toolchain/tests/data/text/project.toml"], "{case}/fixed" = ["project.py"] } }

[[case]]
name = "a notice with two holders"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/project.py" = "# Copyright (C) 2026 Enkrid\n# Copyright (C) 2026 Other\n#\n# Under the GNU Affero General Public License, version 3 only: see license.\nprint(1)\n" }
claims = { status = 0, line = ["no fault in 2 files"] }
false = { files = { "{case}/project.py" = "# Copyright (C) 2026 Enkrid\n# Other\n#\n# Under the GNU Affero General Public License, version 3 only: see license.\nprint(1)\n" } }

[[case]]
name = "a notice of a different holder"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/project.py" = "# Copyright (C) 2026 Someone\n#\n# Under the GNU Affero General Public License, version 3 only: see license.\nprint(1)\n" }
claims = { status = 0, line = ["no fault in 2 files"] }
false = { files = { "{case}/project.py" = "# Copyright (C) 2026 Someone\nprint(1)\n" } }

[[case]]
name = "a comment in a Python file"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/project.py" = "print(1)  # one\n" }
claims = { status = 1, line = ["project.py:1: a comment"] }
false = { files = { "{case}/project.py" = "print(1)\n" } }

[[case]]
name = "a string statement"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/project.py" = "\"\"\"About.\"\"\"\nprint(1)\n" }
claims = { status = 1, line = ["project.py:1: a string statement"] }
false = { files = { "{case}/project.py" = "print(1)\n" } }

