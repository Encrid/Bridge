run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
files = { "{case}/.toolchain/project.toml" = "[check.retired]\nutilise = \"use\"\n", "{case}/.toolchain/docs/a.md" = "# a\n\nWe utilise it.\n" }
