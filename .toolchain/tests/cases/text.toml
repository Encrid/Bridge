claims = { status = 1, line = [".github/workflows/ci.yml:1: a comment"] }
false = { files = { "{case}/.github/workflows/ci.yml" = "name: \"ci # one\"\n" } }

[[case]]
name = "a comment in a document"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
folders = { "{case}/.toolchain" = [".toolchain/tests/data/text/project.toml"] }
files = { "{case}/docs/a.md" = "# a\n\n<!-- hidden -->\n" }
claims = { status = 1, line = ["docs/a.md:3: a comment"] }
false = { files = { "{case}/docs/a.md" = "# a\n\nNo comment.\n" } }

[[case]]
name = "a retired word"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
files = { "{case}/.toolchain/project.toml" = "[check.retired]\nutilise = \"use\"\n", "{case}/docs/a.md" = "# a\n\nWe utilise it.\n" }
claims = { status = 1, line = ["docs/a.md:3: 'utilise' is retired: write 'use'"] }
false = { files = { "{case}/docs/a.md" = "# a\n\nWe use it.\n" } }

[[case]]
name = "a retired word with no new word"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
files = { "{case}/.toolchain/project.toml" = "[check.retired]\nwhilst = \"\"\n", "{case}/docs/a.md" = "# a\n\nWhilst it runs.\n" }
claims = { status = 1, line = ["docs/a.md:3: 'Whilst' is retired"] }
false = { files = { "{case}/.toolchain/project.toml" = "[check.retired]\nwhilst = \"while\"\n" } }

[[case]]
name = "a word that holds a retired word"
run = ["{python}", "{root}/.toolchain/tools/text.py", "--root", "{case}"]
files = { "{case}/.toolchain/project.toml" = "[check.retired]\nutilise = \"use\"\n", "{case}/docs/a.md" = "# a\n\nWe utilised it.\n" }
claims = { status = 0, line = ["no fault in 2 files"] }
false = { files = { "{case}/docs/a.md" = "# a\n\nWe utilise it.\n" } }

