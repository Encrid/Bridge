[[case]]
name = "a dependency, taken"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, line = ["taken: sample, package sample"], files = { "{case}/out/taken/sample/greeting.txt" = "hello from a dependency" } }
false = { run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "sample=tampered"] }

[[case]]
name = "a dependency that is not what its list states"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "sample=tampered"]
claims = { status_not = 0, has = ["refused", "greeting.txt is not what"] }
false = { run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "a copy that is there already"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "sample=listed"]
files = { "{case}/out/taken/sample/greeting.txt" = "hello from a dependency" }
claims = { status = 0, line = ["taken: sample, package sample"] }
false = { files = { "{case}/out/taken/sample/greeting.txt" = "changed" } }

[[case]]
name = "a dependency that is made first"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, line = ["taken: made, package sample"] }
false = { run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "made=nothing"] }

[[case]]
name = "an optional dependency that is not there"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"]
claims = { status = 0, has = ["not taken: ", "nothing/package.txt is not there"] }
false = { run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "maybe=sample"] }

[[case]]
name = "a list that is not there"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "sample=nothing"]
claims = { status_not = 0, has = ["nothing/package.txt is not there"] }
false = { run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }

[[case]]
name = "dependencies that do not agree"
run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out", "--set", "made=other"]
claims = { status_not = 0, has = ["refused: the dependencies do not agree"] }
false = { run = ["{python}", "{root}/.toolchain/tools/fetch.py", "--root", "{root}/.toolchain/tests/data/take", "--out", "{case}/out"] }
