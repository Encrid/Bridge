[[case]]
name = "every check"
run = ["{python}", "{root}/.toolchain/tools/check.py", "--root", "{case}/p"]
folders = { "{case}/p" = ["license", "project.py"], "{case}/p/.toolchain/tools" = [".toolchain/tools/check.py"] }
claims = { status = 0, order = ["layout.py", "text.py", "prose.py", "pseudo.py", "xref.py", "dup.py", "cover.py", "licence.py", "commits.py", "style.py", "c23.py", "every check passes"] }
false = { run = ["{python}", "{root}/.toolchain/tools/check.py", "--root", "{case}"] }

[case.files]
"{case}/p/.github/workflows/ci.yml" = ""
"{case}/p/.github/workflows/release.yml" = ""
"{case}/p/.github/workflows/cla.yml" = ""
"{case}/p/.gitattributes" = ""
"{case}/p/.gitignore" = ""
"{case}/p/cla.md" = ""
"{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n"
"{case}/p/readme.md" = "# p\n\nA project.\n\n## Install\n\nInstall it.\n\n## Usage\n\nUse it.\n\n## Contributing\n\nSign `cla.md`.\n\n## License\n\nThe licence.\n"
"{case}/p/docs/contributing/agreement.md" = ""
"{case}/p/docs/contributing/coding_style.md" = ""
"{case}/p/docs/contributing/commits.md" = ""
"{case}/p/docs/contributing/documentation_style.md" = ""
"{case}/p/docs/contributing/pull_request.md" = ""
"{case}/p/docs/contributing/tests.md" = ""

[[case]]
name = "a range of commits"
run = ["{python}", "{root}/.toolchain/tools/check.py", "--root", "{case}", "--commits", "nothing..nowhere"]
claims = { status = 1, has = ["commits.py: git log nothing..nowhere"] }
false = { run = ["{python}", "{root}/.toolchain/tools/check.py", "--root", "{case}"] }

[[case]]
name = "a tool that is not there"
run = ["{python}", "{case}/.toolchain/tools/check.py", "--root", "{case}"]
folders = { "{case}/.toolchain/tools" = [".toolchain/tools/check.py", ".toolchain/tools/shared.py"], "{case}/.toolchain" = [".toolchain/toolchain.toml"] }
claims = { status = 1, line = ["check.py: failed: layout text prose pseudo xref dup cover licence commits style c23"] }
false = { run = ["{python}", "{root}/.toolchain/tools/check.py", "--root", "{case}"] }
