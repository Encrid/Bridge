[tools]
wasm_as = "{binaryen}/bin/wasm-as"
wasm_merge = "{binaryen}/bin/wasm-merge"
wasm_opt = "{binaryen}/bin/wasm-opt"
wasm_dis = "{binaryen}/bin/wasm-dis"

[[source]]
name = "wasmtime"
url = "https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.5/{wasmtime_archive}"
sha256 = "{wasmtime_sha256}"
into = "{build}/third_party/wasmtime/{target}"
top = "{wasmtime_top}"

[[source]]
name = "binaryen"
url = "https://github.com/WebAssembly/binaryen/releases/download/version_133/{binaryen_archive}"
sha256 = "{binaryen_sha256}"
into = "{build}/third_party/binaryen/{target}"
top = "{binaryen_top}"

[kinds.wasm_text]
output = "{name}.wasm"
steps = [
    { run = ["{wasm_as}", "{sources}", "{features}", "-o", "{output}"] },
]

[kinds.wasm_module]
output = "{name}.wasm"
steps = [
    { run = ["{zig}", "cc", "-target", "wasm32-freestanding", "{language}", "-Wno-missing-field-initializers", "-O2", "-nostdlib", "{defines}", "{include}", "-Wl,--no-entry", "-o", "{work}.raw.wasm", "{sources}"] },
    { run = ["{python}", "{root}/.toolchain/tools/wasm_guard.py", "{work}.raw.wasm"] },
    { run = ["{wasm_merge}", "{work}.raw.wasm", "main", "{acc_wasm}", "acc", "{features}", "-o", "{work}.merged.wasm"] },
    { run = ["{wasm_opt}", "{work}.merged.wasm", "{features}", "-O3", "--remove-exports=acc_*", "--remove-unused-module-elements", "-o", "{output}"] },
]

