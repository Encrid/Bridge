[project]
name = "Bridge"

[test]
timeout = 120
copies = 6
writers = ["abi_refuse", "module_refuse", "reload_refuse", "say_error", "say_about", "module_fail", "config_refuse", "schema_refuse", "snprintf"]

[variables]
quiet = ["-Wno-missing-field-initializers"]
hidden = ["-fvisibility=hidden"]
