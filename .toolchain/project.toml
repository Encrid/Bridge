system_libraries = []
counted_system = ["WINBASEAPI=", "CreateEventA=counted_create_event", "CreateThread=counted_create_thread"]

[[artifact]]
name = "bridge"
kind = "library"
sources = ["src/*.c", "src/os/{system}/*.c"]
include = ["include", "src", "src/os"]
defines = ["BRIDGE_BUILDING"]
flags = ["{quiet}", "{hidden}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "bridge"
kind = "archive"
sources = ["src/*.c", "src/os/{system}/*.c"]
include = ["include", "src", "src/os"]
defines = ["BRIDGE_BUILDING"]
flags = ["{quiet}", "{hidden}", "{system_defines}"]

[[artifact]]
name = "counted"
kind = "archive"
test = true
sources = ["src/*.c"]
include = ["include", "src", "src/os"]
defines = ["malloc=counted_malloc", "calloc=counted_calloc", "realloc=counted_realloc", "free=counted_free", "os_reserve=counted_os_reserve"]
flags = ["{quiet}", "{system_defines}"]

[[artifact]]
name = "counted_os"
kind = "archive"
test = true
sources = ["src/os/{system}/*.c"]
include = ["src/os"]
defines = ["malloc=counted_malloc", "calloc=counted_calloc", "realloc=counted_realloc", "free=counted_free", "{counted_system}"]
flags = ["{quiet}", "{system_defines}"]

[[artifact]]
