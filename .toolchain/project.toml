[[style.exception]]
rule = "F5"
path = "src/backends/wasm/wasm_adopted.c:make_memory"
why = "wasmtime fixes the signature of its linear-memory create callback."

[[branches.exception]]
path = "src/backends/wasm/wasm_adopted.c"
line = 17
col = 26
side = "function"
why = "An adopted block reports a capacity equal to its size, so wasmtime never grows it and never calls grow_adopted."

[[branches.exception]]
path = "src/backends/wasm/wasm_adopted.c"
line = 21
col = 9
side = "true"
why = "grow_adopted never runs, because an adopted block reports a capacity equal to its size."

[[branches.exception]]
path = "src/backends/wasm/wasm_adopted.c"
line = 21
col = 9
side = "false"
why = "grow_adopted never runs, because an adopted block reports a capacity equal to its size."

[[branches.exception]]
path = "src/backends/wasm/wasm_adopted.c"
line = 33
col = 9
side = "true"
why = "wasmtime asks the creator for the reservation it was configured with, which is WASM_RESERVATION, so it never asks for more."

[[branches.exception]]
path = "src/backends/wasm/wasm_adopted.c"
line = 33
col = 40
side = "true"
why = "wasmtime asks the creator for the guard it was configured with, which is WASM_GUARD, so it never asks for more."

[[branches.exception]]
path = "src/backends/wasm/wasm_adopted.c"
line = 38
col = 9
side = "true"
why = "The holder declares the adopted block's exact page count, so the import minimum always equals the block length."

[[branches.exception]]
path = "src/backends/wasm/wasm_fail.c"
line = 37
col = 10
side = "true"
