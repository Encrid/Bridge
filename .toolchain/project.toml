[kinds.host_wasm]
output = "{name}.wasm"
steps = [
    { run = ["{wasm_as}", "src/backends/wasm/bridge_wasm.wat", "{features}", "-o", "{work}.acc.wasm"] },
    { run = ["{zig}", "cc", "-target", "wasm32-freestanding", "{language}", "-Wno-missing-field-initializers", "-O2", "-nostdlib", "-DBRIDGE_ROWS_CHECKED", "{defines}", "{include}", "-Wl,--no-entry", "-o", "{work}.raw.wasm", "{sources}"] },
    { run = ["{wasm_merge}", "{work}.raw.wasm", "main", "{work}.acc.wasm", "acc", "{features}", "-o", "{work}.merged.wasm"] },
    { run = ["{wasm_opt}", "{work}.merged.wasm", "{features}", "-O3", "--remove-exports=acc_*", "--remove-unused-module-elements", "-o", "{output}"] },
    { section = "bridge:manifest", text = "{manifest:\u0000}" },
]

[kinds.host_native]
output = "{name}{library}"
steps = [
    { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "-O2", "-DNDEBUG", "{language}", "-Wno-missing-field-initializers", "{pic}", "{include}", "-fvisibility=hidden", '-DMANIFEST="{manifest:\0}"', '-DMANIFEST_SECTION="{section}"', '-DLIBRARY_SUFFIX="{library}"', "-shared", "{defines}", "{sources}", "-o", "{output}"] },
    { contains = "{manifest:\u0000}" },
]

[kinds.madebin]
output = "{name}.bin"
steps = [
    { run = ["{python}", "tests/host/modules/mkbin.py", "{output}", "{name}"] },
]

