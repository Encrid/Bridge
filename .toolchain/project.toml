[project]
name = "Bridge"

[test]
timeout = 120
copies = 6
writers = ["abi_refuse", "module_refuse", "reload_refuse", "say_error", "say_about", "module_fail", "config_refuse", "schema_refuse", "snprintf", "printf"]

[variables]
own = ["abi=1", "pinned=false", "reloadable=false", "config=none"]
quiet = ["-Wno-missing-field-initializers"]
hidden = ["-fvisibility=hidden"]
binaryen_top = "binaryen-version_133"
features = ["--enable-multimemory", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals"]
acc_wasm = "{out}/wasm/acc.wasm"
