[[artifact]]
name = "bridge"
kind = "library"
sources = ["src/**/*.c"]
link = ["{bridge_os}/os.a"]
include = ["include", "{bridge_os}/include", "src", "src/abi", "src/backend", "src/block", "src/bridge", "src/config", "src/module", "src/pool", "src/region", "src/reload", "src/say", "src/schedule", "src/schema", "src/storage"]
defines = ["BRIDGE_BUILDING"]
flags = ["{quiet}", "{hidden}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "bridge"
kind = "archive"
sources = ["src/**/*.c"]
include = ["include", "{bridge_os}/include", "src", "src/abi", "src/backend", "src/block", "src/bridge", "src/config", "src/module", "src/pool", "src/region", "src/reload", "src/say", "src/schedule", "src/schema", "src/storage"]
defines = ["BRIDGE_BUILDING"]
flags = ["{quiet}", "{hidden}", "{system_defines}"]

[[artifact]]
name = "leaks.toml"
kind = "file"
sources = ["src/leaks.toml"]

[[artifact]]
name = "counted"
kind = "archive"
test = true
sources = ["src/**/*.c"]
include = ["include", "{bridge_os}/include", "src", "src/abi", "src/backend", "src/block", "src/bridge", "src/config", "src/module", "src/pool", "src/region", "src/reload", "src/say", "src/schedule", "src/schema", "src/storage"]
defines = ["malloc=counted_malloc", "calloc=counted_calloc", "realloc=counted_realloc", "free=counted_free", "os_reserve=counted_os_reserve", "os_commit=counted_os_commit", "os_thread_start=counted_os_thread_start", "os_mutex_create=counted_os_mutex_create", "os_event_create=counted_os_event_create"]
flags = ["{quiet}", "{system_defines}"]

[[artifact]]
name = "bridge_tests"
kind = "library"
test = true
folder = "backends"
sources = ["tests/backend/tests_abi.c", "tests/backend/tests_backend.c", "tests/backend/tests_memory.c", "tests/backend/tests_define.c", "tests/backend/tests_module.c", "tests/backend/tests_instance.c", "tests/backend/tests_func.c", "tests/backend/tests_load.c", "tests/backend/tests_phase.c", "tests/backend/tests_moves.c"]
include = ["include", "{bridge_os}/include", "tests/binding"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
variants = [{ name = "bridge_tests_all" }]
link = ["{bridge_os}/os.a"]

[[artifact]]
name = "bridge_plain_other"
kind = "library"
test = true
folder = "backends"
sources = ["tests/backend/tests_backend.c", "tests/backend/tests_memory.c", "tests/backend/tests_define.c", "tests/backend/tests_module.c", "tests/backend/tests_instance.c", "tests/backend/tests_func.c", "tests/backend/tests_load.c", "tests/backend/tests_phase.c", "tests/backend/tests_moves.c", "tests/support/plain_other_abi.c"]
include = ["include", "{bridge_os}/include", "tests/binding"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
link = ["{bridge_os}/os.a"]

[[artifact]]
name = "bridge_plain_refusing"
kind = "library"
test = true
folder = "backends"
