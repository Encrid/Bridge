[[artifact]]
name = "schema"
kind = "program"
test = true
sources = ["tests/schema/*.c", "src/schema/*.c"]
include = ["include", "{bridge_os}/include", "src", "src/abi", "src/backend", "src/block", "src/bridge", "src/config", "src/module", "src/pool", "src/region", "src/reload", "src/say", "src/schedule", "src/schema", "src/storage"]
defines = ["BRIDGE_BUILDING"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "storage"
kind = "program"
test = true
sources = ["tests/storage/*.c", "tests/support/host_copy*.c", "src/**/*.c"]
include = ["include", "tests/support", "{bridge_os}/include", "src", "src/abi", "src/backend", "src/block", "src/bridge", "src/config", "src/module", "src/pool", "src/region", "src/reload", "src/say", "src/schedule", "src/schema", "src/storage"]
defines = ["BRIDGE_BUILDING", "{paths}"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
link = ["{bridge_os}/os.a"]

[[artifact]]
name = "storage-counted"
kind = "program"
test = true
sources = ["tests/storage/*.c", "tests/support/host_copy*.c"]
include = ["include", "tests/support", "{bridge_os}/include", "src", "src/abi", "src/backend", "src/block", "src/bridge", "src/config", "src/module", "src/pool", "src/region", "src/reload", "src/say", "src/schedule", "src/schema", "src/storage"]
defines = ["COUNTED", "{paths}"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
link = ["{out}/counted.a", "{bridge_os}/os.a"]

[[artifact]]
name = "seam"
kind = "program"
test = true
sources = ["tests/seam/*.c", "tests/support/host*.c", "tests/support/{system}/host*.c"]
include = ["include", "tests/support"]
defines = ["{paths}"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}", "{host_resources}"]
link = ["{out}/bridge{library}"]

[[artifact]]
name = "seam-static"
kind = "program"
test = true
sources = ["tests/seam/*.c", "tests/support/host*.c", "tests/support/{system}/host*.c"]
include = ["include", "tests/support"]
defines = ["{paths}"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}", "{host_resources}"]
link = ["{out}/bridge.a", "{bridge_os}/os.a"]
