[[case]]
name = "another namespace, refused"
run = ["{out}/bridge-host{exe}", "{case}/guest.toml"]

[case.claims]
status = 1
line = ["not loaded: guest/guest.wasm: guest:word@1.0.0 was refused"]
lacks = ["loaded: guest:word@1.0.0, wasm, guest/guest.wasm"]

[case.folders]
"{case}/guest" = ["guest"]

[case.files]
"{case}/guest.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["late"]
rounds = 8
[content]
paths = ["guest"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/guest.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["late"]
rounds = 8
[module."guest:word@1.0.0"]
read = ["bridge-host:Word"]
[content]
paths = ["guest"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "another namespace, granted"
run = ["{out}/bridge-host{exe}", "{case}/guest.toml"]

[case.claims]
status = 0
line = ["loaded: guest:word@1.0.0, wasm, guest/guest.wasm"]

[case.folders]
"{case}/guest" = ["guest"]

[case.files]
"{case}/guest.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["late"]
rounds = 8
[module."guest:word@1.0.0"]
read = ["bridge-host:Word"]
[content]
paths = ["guest"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/guest.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["late"]
rounds = 8
[content]
paths = ["guest"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''
