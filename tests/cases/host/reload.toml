[[case]]
name = "a reload to a file with a bad manifest"
run = ["{out}/bridge-host{exe}", "{case}/r.toml"]
script = [{ wait = "? go on", put = { "{case}/d/swap.wasm" = "nocolon" }, type = "go" }]

[case.claims]
status = 0
has = ["not replaced: d/swap.wasm: its manifest does not begin with who it is"]

[case.folders]
"{case}/d" = ["wait", "swap"]

[case.files]
"{case}/r.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[module."bridge-host:swap@1.0.0"]
hot_reload = true
[content]
paths = ["d"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

