[[case]]
name = "found, and told who"
run = ["{out}/bridge-host{exe}", "{case}/folder-found.toml"]
script = [{ wait = "? go on", type = "go" }]

[case.claims]
status = 0
line = [
    "loaded: bridge-host:wait@1.0.0, native, trusted, folder-found/wait{library}",
    "not a module: folder-found/plain.wasm: no manifest",
]

[case.folders]
"{case}/folder-found" = ["wait", "plain"]

[case.files]
"{case}/folder-found.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-found"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.folders]
"{case}/folder-found" = ["wait"]

[[case]]
name = "not loaded, and why"
run = ["{out}/bridge-host{exe}", "{case}/folder-why.toml"]
script = [{ wait = "? go on", type = "go" }]

[case.claims]
status = 0
line = [
    "not loaded: folder-why/quiet2.wasm: bridge-host:quiet@1.0.0 is folder-why/quiet.wasm",
    "not loaded: folder-why/noabi.wasm: bridge-host:noabi@1.0.0 states no abi",
]

[case.folders]
"{case}/folder-why" = ["wait", "quiet", "quiet2", "noabi"]

[case.files]
"{case}/folder-why.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-why"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.folders]
"{case}/folder-why" = ["wait", "quiet"]

[[case]]
name = "taken in while it runs"
run = ["{out}/bridge-host{exe}", "{case}/folder-in.toml"]
script = [{ wait = "? go on", put = { "{case}/folder-in/quiet.wasm" = "quiet" }, type = "go" }]

[case.claims]
status = 0
order = [
    "? go on",
    "loaded: bridge-host:quiet@1.0.0, wasm, not trusted, folder-in/quiet.wasm",
    "record[6] bridge-host:quiet@1.0.0/say: said once 1 0",
]

[case.folders]
"{case}/folder-in" = ["wait"]

[case.files]
"{case}/folder-in.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-in"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

[[case]]
name = "taken out while it runs"
run = ["{out}/bridge-host{exe}", "{case}/folder-out.toml"]
script = [{ wait = "? go on", remove = ["{case}/folder-out/quiet.wasm"], type = "go" }]

[case.claims]
status = 0
order = [
    "loaded: bridge-host:quiet@1.0.0, wasm, not trusted, folder-out/quiet.wasm",
    "? go on",
    "unloaded: bridge-host:quiet@1.0.0: folder-out/quiet.wasm is gone",
]

[case.folders]
"{case}/folder-out" = ["wait", "quiet"]

[case.files]
"{case}/folder-out.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-out"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

[[case]]
name = "replaced, and what it kept"
run = ["{out}/bridge-host{exe}", "{case}/folder-replaced.toml"]
script = [{ wait = "? go on", put = { "{case}/folder-replaced/swap.wasm" = "swap2" }, type = "go" }]

[case.claims]
status = 0
order = [
    "record[6] bridge-host:swap@1.0.0/say: swaps 1 0",
    "replaced: bridge-host:swap@1.0.0 by bridge-host:swap@1.0.0, folder-replaced/swap.wasm",
    "still loaded: bridge-host:swap@1.0.0, bridge-host:wait@1.0.0",
]
lacks = ["swapped"]

[case.folders]
"{case}/folder-replaced" = ["wait", "swap"]

[case.files]
"{case}/folder-replaced.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[module."bridge-host:swap@1.0.0"]
hot_reload = true
[content]
paths = ["folder-replaced"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

[[case]]
name = "not replaced"
run = ["{out}/bridge-host{exe}", "{case}/folder-left.toml"]
script = [{ wait = "? go on", put = { "{case}/folder-left/quiet.wasm" = "quiet2" }, type = "go" }]

[case.claims]
status = 0
line = ["not replaced: bridge-host:quiet@1.0.0: it does not say it can be"]

[case.folders]
"{case}/folder-left" = ["wait", "quiet"]

[case.files]
"{case}/folder-left.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-left"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

[[case]]
name = "a native one arrives, asked: yes"
run = ["{out}/bridge-host{exe}", "{case}/folder-yes.toml"]
script = [
    { wait = "? go on", put = { "{case}/folder-yes/knock{library}" = "knock" }, type = "go" },
    { wait = "? trust bridge-host:knock@1.0.0, native, folder-yes/knock{library}", type = "yes" },
]

[case.claims]
status = 0
order = [
    "? trust bridge-host:knock@1.0.0, native, folder-yes/knock{library}",
    "loaded: bridge-host:knock@1.0.0, native, trusted, folder-yes/knock{library}",
    "record[6] bridge-host:knock@1.0.0/say: knock 0 0",
]

[case.folders]
"{case}/folder-yes" = ["wait"]

[case.files]
"{case}/folder-yes.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-yes"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [
    { wait = "? go on", put = { "{case}/folder-yes/knock{library}" = "knock" }, type = "go" },
    { wait = "? trust bridge-host:knock@1.0.0, native, folder-yes/knock{library}", type = "no" },
]

[[case]]
name = "a native one arrives, asked: no"
run = ["{out}/bridge-host{exe}", "{case}/folder-no.toml"]
script = [
    { wait = "? go on", put = { "{case}/folder-no/knock{library}" = "knock" }, type = "go" },
    { wait = "? trust bridge-host:knock@1.0.0, native, folder-no/knock{library}", type = "no" },
]

[case.claims]
status = 0
line = ["not loaded: folder-no/knock{library}: bridge-host:knock@1.0.0, native, not trusted"]
lacks = ["knock@1.0.0/say"]

[case.folders]
"{case}/folder-no" = ["wait"]

[case.files]
"{case}/folder-no.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[content]
paths = ["folder-no"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [
    { wait = "? go on", put = { "{case}/folder-no/knock{library}" = "knock" }, type = "go" },
    { wait = "? trust bridge-host:knock@1.0.0, native, folder-no/knock{library}", type = "yes" },
]

[[case]]
name = "a native one arrives, loaded"
