[[case]]
name = "a world that runs for as long as there is work"
run = ["{out}/bridge-host{exe}", "{case}/zero.toml"]

[case.claims]
status = 0
has = ["record[6] bridge-host:quiet@1.0.0/say: said once 1 0"]
lacks = ["ended after"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/zero.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 0
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.folders]
"{case}/cq" = ["mute"]

[[case]]
name = "the config shown when it is refused"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/bad.toml"]

[case.claims]
status = 1
has = ["bogus: no key of Bridge-Host's or Bridge's"]

[case.files]
"{case}/bad.toml" = '''
bogus = 1
'''

[case.false]
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/none.toml"]

[[case]]
name = "the config shown with a content path that is not there"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/gone.toml"]

[case.claims]
status = 1
has = ["cannot look in 'notthere'"]

[case.files]
"{case}/gone.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["notthere"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.folders]
"{case}/notthere" = ["quiet"]
