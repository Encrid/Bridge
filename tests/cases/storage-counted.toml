[[case]]
name = "allocation-changes"
run = ["{out}/storage-counted{exe}", "changes"]
claims = { output = "tests/storage_changes.txt" }
false = { run = ["{out}/storage-counted{exe}", "tables"] }

[[case]]
name = "allocation-tables"
run = ["{out}/storage-counted{exe}", "tables"]
claims = { output = "tests/storage_tables.txt" }
false = { run = ["{out}/storage-counted{exe}", "strip"] }

[[case]]
name = "allocation-strip"
run = ["{out}/storage-counted{exe}", "strip"]
claims = { output = "tests/storage_strip.txt" }
false = { run = ["{out}/storage-counted{exe}", "nomemory"] }

[[case]]
name = "allocation-each-refused-in-turn"
run = ["{out}/storage-counted{exe}", "nomemory"]
claims = { matches = ["more than forty allocations were each answered null in turn.*alive"], lacks = ["FAIL"] }
false = { run = ["{out}/storage-counted{exe}", "changes"] }

[[case]]
name = "allocation-each-refused-in-turn-laying-out-again"
run = ["{out}/storage-counted{exe}", "nomemoryrelay"]
claims = { matches = ["more than forty allocations were each answered null in turn.*alive"], lacks = ["FAIL"] }
false = { run = ["{out}/storage-counted{exe}", "changes"] }

[[case]]
name = "allocation-each-refused-in-turn-laying-out-a-type-no-row-carries"
run = ["{out}/storage-counted{exe}", "nomemoryrelayempty"]
claims = { matches = ["more than forty allocations were each answered null in turn.*alive"], lacks = ["FAIL"] }
false = { run = ["{out}/storage-counted{exe}", "changes"] }

[[case]]
name = "allocation-each-refused-in-turn-seeding-settings"
run = ["{out}/storage-counted{exe}", "nomemoryconfig"]
claims = { matches = ["\\d+ allocations were each answered null in turn.*alive"], lacks = ["FAIL"] }
false = { run = ["{out}/storage-counted{exe}", "changes"] }

[[case]]
name = "allocation-each-refused-in-turn-with-four-threads"
run = ["{out}/storage-counted{exe}", "nomemorythreads"]
claims = { matches = ["more than forty allocations were each answered null in turn.*alive"], lacks = ["FAIL"] }
false = { run = ["{out}/storage-counted{exe}", "changes"] }
