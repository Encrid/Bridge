[[case]]
name = "static-bridge_load-loaded"
run = ["{out}/seam-static{exe}", "bridge_load-loaded"]
claims = { matches = ["test:ok@0.1.0: loaded.*alive"] }
false = { run = ["{out}/seam-static{exe}", "bridge_load-init-trapped"] }

