code = ["include/**", "src/abi/abi.h", "src/abi/abi_alloc.c", "src/abi/abi_before.c", "src/abi/abi_calls.c", "src/abi/abi_declare.c", "src/abi/abi_declare.h", "src/abi/abi_define.c", "src/abi/abi_entry.h", "src/abi/abi_layout.c", "src/abi/abi_make.c", "src/abi/abi_moved.c", "src/abi/abi_names.c", "src/abi/abi_on_destroy.c", "src/abi/abi_phase.c", "src/abi/abi_replace.c", "src/abi/abi_slots.h", "src/abi/abi_stated.c", "src/abi/abi_subscribe.c", "src/abi/abi_subscribe.h", "src/abi/abi_subscriber.c", "src/abi/abi_subscriber_room.c", "src/abi/abi_system.c", "src/abi/abi_term.c", "src/backend/**", "src/bits.h", "src/block/**", "src/bridge/bridge_backend.c", "src/bridge/bridge_backends.c", "src/bridge/bridge_calls.c", "src/bridge/bridge_check.c", "src/bridge/bridge_create.c", "src/bridge/bridge_destroy.c", "src/bridge/bridge_inside.h", "src/bridge/bridge_keys.c", "src/bridge/bridge_load.c", "src/bridge/bridge_phases.c", "src/bridge/bridge_reload.c", "src/bridge/bridge_run.c", "src/bridge/bridge_stop.c", "src/bridge/bridge_unload.c", "src/bridge/bridge_usage.c", "src/hash.h", "src/inside.h", "src/leaks.toml", "src/module/module.h", "src/module/module_call.c", "src/module/module_check.c", "src/module/module_check_backend.c", "src/module/module_check_fit.c", "src/module/module_check_phases.c", "src/module/module_check_stated.c", "src/module/module_discard.c", "src/module/module_identity.c", "src/module/module_instance.c", "src/module/module_record.c", "src/module/module_say.c", "src/module/module_share.c", "src/module/module_shutdown.c", "src/module/module_start.c", "src/module/module_types.c", "src/reload/reload.h", "src/reload/reload_check.c", "src/reload/reload_record.c", "src/reload/reload_rows.c", "src/reload/reload_share.c", "src/schedule/schedule.h", "src/schedule/schedule_account.c", "src/schedule/schedule_before.c", "src/schedule/schedule_bits.h", "src/schedule/schedule_build.c", "src/schedule/schedule_check.c", "src/schedule/schedule_closure.c", "src/schedule/schedule_commit.c", "src/schedule/schedule_conflict.c", "src/schedule/schedule_cross.c", "src/schedule/schedule_dispatch.c", "src/schedule/schedule_edges.c", "src/schedule/schedule_group.c", "src/schedule/schedule_jobs.c", "src/schedule/schedule_levels.c", "src/schedule/schedule_marks.c", "src/schedule/schedule_matrix.c", "src/schedule/schedule_names.c", "src/schedule/schedule_order.c", "src/schedule/schedule_run.c", "src/schedule/schedule_triggered.c", "src/schedule/schedule_unordered.c", "src/schedule/schedule_uses.c", "src/storage/**", "tests/backend/**", "tests/binding/**", "tests/modules/**", "tests/seam/**", "tests/shared/**", "tests/support/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "storage-seam"
run = ["{out}/seam{exe}"]
claims = { status = 0 }
rows = [
    { name = "module_config.spans-with-no-room-to-round-the-match-stopped", in = "module_config.spans-with-no-room-to-round-the-match-stopped", claims = { matches = ["module 'test:spare@0.1.0' is stopped: what its queries match no longer fits in its spans of 356 bytes.*test:spare@0.1.0=STOPPED.*alive"] }, false = "module_config.spans-a-multiple-of-8-taken" },
    { name = "module_config.spans-outgrown-on_error-fail-stops-the-world", in = "module_config.spans-outgrown-on_error-fail-stops-the-world", claims = { matches = ["no longer fits in its spans of 640 bytes.*the world has stopped: module 'game:mover@0.1.0' was stopped and its on_error is fail.*alive"] }, false = "module_config.spans-outgrown-on_error-skip-stops-only-the-module" },
    { name = "destroy-with-a-read-grant-left", in = "destroy-with-a-read-grant-left", claims = { matches = ["reap: rows 1 0.*module 'view:reaper@0.1.0' asked to destroy entities that carry nothing it may write. Left as they were: 1.*reap: rows 1 0.*alive"], lacks = ["rows 0 0"] }, false = "module_config.write-destroy-goes" },
    { name = "module_config.write-destroy-goes", in = "module_config.write-destroy-goes", claims = { matches = ["reap: rows 1 0.*reap: rows 0 0.*alive"], lacks = ["Left as they were"] }, false = "destroy-with-a-read-grant-left" },
    { name = "module_config.spans-outgrown-at-a-barrier", in = "module_config.spans-outgrown-at-a-barrier", claims = { matches = ["module 'game:mover@0\\.1\\.0' is stopped: what its queries match no longer fits in its spans of 640 bytes.*alive"] }, false = "BRIDGE_SPAN_SIZE-what-a-span-takes-of-the-spans" },
    { name = "destroy-of-a-bare-id-beside-an-apart-type-done", in = "destroy-of-a-bare-id-beside-an-apart-type-done", claims = { matches = ["test:guess@0.1.0: loaded.*test:guess@0.1.0=RUNNING.*alive"], matches_not = ["asked to destroy"] }, false = "destroy-of-a-carried-id-beside-an-apart-type-refused" },
    { name = "destroy-of-a-carried-id-beside-an-apart-type-refused", in = "destroy-of-a-carried-id-beside-an-apart-type-refused", claims = { matches = ["game:hearer@0.1.0: loaded.*test:guess@0.1.0: loaded.*asked to destroy entities that carry nothing it may write. Left as they were: 1.*test:guess@0.1.0=RUNNING.*alive"] }, false = "destroy-of-a-bare-id-beside-an-apart-type-done" },
    { name = "destroy-of-an-id-in-a-table-it-cannot-write-refused", in = "destroy-of-an-id-in-a-table-it-cannot-write-refused", claims = { matches = ["test:stick@0.1.0: loaded.*test:guess@0.1.0: loaded.*asked to destroy entities that carry nothing it may write. Left as they were: 1.*test:guess@0.1.0=RUNNING.*alive"], matches_not = ["hearer"] }, false = "destroy-of-a-bare-id-beside-an-apart-type-done" },
    { name = "destroy-of-index-0-is-nothing", in = "destroy-of-index-0-is-nothing", claims = { matches = ["test:guess@0.1.0: loaded.*alive"], matches_not = ["asked to destroy", "no entity", "stopped"] }, false = "destroy-of-a-held-id-refused" },
    { name = "destroy-of-an-index-past-every-entity-is-nothing", in = "destroy-of-an-index-past-every-entity-is-nothing", claims = { matches = ["test:guess@0.1.0: loaded.*alive"], matches_not = ["asked to destroy", "no entity", "stopped"] }, false = "destroy-of-a-held-id-refused" },
    { name = "destroy-of-a-held-id-refused", in = "destroy-of-a-held-id-refused", claims = { matches = ["asked to destroy entities that carry nothing it may write. Left as they were: 1.*alive"] }, false = "destroy-of-a-handed-out-id-done" },
    { name = "destroy-of-a-handed-out-id-done", in = "destroy-of-a-handed-out-id-done", claims = { matches = ["test:guess@0.1.0: loaded.*alive"], matches_not = ["asked to destroy"] }, false = "destroy-of-a-held-id-refused" },
    { name = "destroy-of-each-empty-entity-in-the-index-meets-no-held-id", in = "destroy-of-each-empty-entity-in-the-index-meets-no-held-id", claims = { matches = ["test:sweeper@0.1.0: loaded.*sweep: swept 1 .*sweep: swept 0 .*alive"], matches_not = ["asked to destroy"] }, false = "destroy-of-a-held-id-in-place-of-the-sweep-refused" },
    { name = "attach-to-a-held-id-refused", in = "attach-to-a-held-id-refused", claims = { matches = ["asked to attach or detach a component of an id that spawn never handed it. Left undone: 1.*alive"], matches_not = ["rows 1", "is stopped"] }, false = "attach-to-a-handed-out-id-done" },
    { name = "attach-to-a-handed-out-id-done", in = "attach-to-a-handed-out-id-done", claims = { matches = ["test:stick@0.1.0/count: rows 0 0.*test:stick@0.1.0/count: rows 1 0.*alive"] }, false = "attach-to-a-held-id-refused" },
    { name = "destroy-of-id-0-refused", in = "destroy-of-id-0-refused", claims = { matches = ["system 'act' failed: destroy: the id 0 is no entity.*alive"] }, false = "attach-tag-with-a-value-refused" },
    { name = "destroy-keeps-a-component-of-BRIDGE_ON_DESTROY_KEEP-on-a-husk", in = "destroy-keeps-a-component-of-BRIDGE_ON_DESTROY_KEEP-on-a-husk", claims = { matches = ["husk:husk@0\\.1\\.0/look: e kept 2 7\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "destroy-removes-each-component-that-the-husk-does-not-keep", in = "destroy-removes-each-component-that-the-husk-does-not-keep", claims = { matches = ["husk:husk@0\\.1\\.0/look: e body 2 0\\b.*alive"] }, false = "attach-to-an-entity-that-is-no-husk-applies" },
    { name = "observe-a-husk-that-no-longer-matches-heard-leave", in = "observe-a-husk-that-no-longer-matches-heard-leave", claims = { matches = ["husk:husk@0\\.1\\.0/look: heard body 2 2\\b.*alive"] }, false = "attach-to-an-entity-that-is-no-husk-applies" },
    { name = "observe-a-husk-that-matches-only-now-heard-enter", in = "observe-a-husk-that-matches-only-now-heard-enter", claims = { matches = ["husk:husk@0\\.1\\.0/look: heard lone 2 2\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "observe-a-husk-that-still-matches-heard-nothing", in = "observe-a-husk-that-still-matches-heard-nothing", claims = { matches = ["husk:husk@0\\.1\\.0/look: heard handle 2 0\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "observe-an-entity-made-and-destroyed-in-one-phase-heard-as-a-husk", in = "observe-an-entity-made-and-destroyed-in-one-phase-heard-as-a-husk", claims = { matches = ["husk:husk@0\\.1\\.0/look: heard lone 1 1\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "observe-a-husk-that-goes-heard-leave", in = "observe-a-husk-that-goes-heard-leave", claims = { matches = ["husk:husk@0\\.1\\.0/look: heard handle 5 1\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "bridge_entity_t-a-husk-keeps-its-index-and-generation", in = "bridge_entity_t-a-husk-keeps-its-index-and-generation", claims = { matches = ["husk:husk@0\\.1\\.0/look: e alive 2 1\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "attach-to-a-husk-is-nothing", in = "attach-to-a-husk-is-nothing", claims = { matches = ["husk:husk@0\\.1\\.0/look: e body 3 0\\b.*alive"] }, false = "attach-to-an-entity-that-is-no-husk-applies" },
    { name = "attach-after-a-destroy-in-one-phase-is-nothing-on-the-husk", in = "attach-after-a-destroy-in-one-phase-is-nothing-on-the-husk", claims = { matches = ["husk:husk@0\\.1\\.0/look: g kept 2 4\\b.*alive"] }, false = "attach-to-an-entity-that-is-no-husk-applies" },
    { name = "destroy-of-a-husk-is-nothing", in = "destroy-of-a-husk-is-nothing", claims = { matches = ["husk:husk@0\\.1\\.0/look: e alive 4 1\\b.*alive"], lacks = ["asked to destroy entities"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "detach-of-the-last-component-of-a-husk-destroys-it", in = "detach-of-the-last-component-of-a-husk-destroys-it", claims = { matches = ["husk:husk@0\\.1\\.0/look: e alive 5 0\\b.*entities freed by the detach: 1\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "destroy-a-husk-found-by-a-query-of-what-it-carries", in = "destroy-a-husk-found-by-a-query-of-what-it-carries", claims = { matches = ["husk:husk@0\\.1\\.0/look: found 2 3\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "bridge_usage-a-husk-counts-among-the-entities", in = "bridge_usage-a-husk-counts-among-the-entities", claims = { matches = ["entities freed by the destroys: 0\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "bridge_destroy-shutdown-reads-what-each-husk-keeps", in = "bridge_destroy-shutdown-reads-what-each-husk-keeps", claims = { matches = ["husk:husk@0\\.1\\.0/-: release 2 9\\b.*alive"] }, false = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk" },
    { name = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk", in = "BRIDGE_ON_DESTROY_REMOVE-a-destroy-leaves-no-husk", claims = { matches = ["husk:husk@0\\.1\\.0/look: found 2 0\\b.*husk:husk@0\\.1\\.0/look: e alive 2 0\\b.*alive"] }, false = "destroy-keeps-a-component-of-BRIDGE_ON_DESTROY_KEEP-on-a-husk" },
    { name = "attach-to-an-entity-that-is-no-husk-applies", in = "attach-to-an-entity-that-is-no-husk-applies", claims = { matches = ["husk:husk@0\\.1\\.0/look: e body 3 2\\b.*alive"] }, false = "attach-to-a-husk-is-nothing" },
    { name = "bridge_reload-a-husk-stays-and-the-new-instance-finds-it", in = "bridge_reload-a-husk-stays-and-the-new-instance-finds-it", claims = { matches = ["husk:husk@0\\.2\\.0: reloaded.*husk:husk@0\\.2\\.0/look: found again 1 2\\b.*alive"] }, false = "bridge_reload-finds-no-husk-of-BRIDGE_ON_DESTROY_REMOVE" },
    { name = "bridge_reload-finds-no-husk-of-BRIDGE_ON_DESTROY_REMOVE", in = "bridge_reload-finds-no-husk-of-BRIDGE_ON_DESTROY_REMOVE", claims = { matches = ["husk:husk@0\\.2\\.0: reloaded.*husk:husk@0\\.2\\.0/look: found again 1 0\\b.*alive"] }, false = "bridge_reload-a-husk-stays-and-the-new-instance-finds-it" },
    { name = "bridge_unload-shutdown-reads-what-each-husk-keeps", in = "bridge_unload-shutdown-reads-what-each-husk-keeps", claims = { matches = ["husk:husk@0\\.1\\.0/-: release 2 9\\b.*husk:husk@0\\.1\\.0: unloaded.*alive"] }, false = "bridge_unload-shutdown-of-BRIDGE_ON_DESTROY_REMOVE-reads-no-husk" },
    { name = "bridge_unload-shutdown-of-BRIDGE_ON_DESTROY_REMOVE-reads-no-husk", in = "bridge_unload-shutdown-of-BRIDGE_ON_DESTROY_REMOVE-reads-no-husk", claims = { matches = ["husk:husk@0\\.1\\.0/-: release 0 0\\b.*husk:husk@0\\.1\\.0: unloaded.*alive"] }, false = "bridge_unload-shutdown-reads-what-each-husk-keeps" },
    { name = "BRIDGE_STRIP-a-husk-left-with-nothing-goes-at-the-unload", in = "BRIDGE_STRIP-a-husk-left-with-nothing-goes-at-the-unload", claims = { matches = ["husk:husk@0\\.1\\.0: unloaded.*entities after the unload: 0\\b.*alive"] }, false = "bridge_unload-a-husk-stays-while-another-module-declares-what-it-keeps" },
    { name = "bridge_unload-a-husk-stays-while-another-module-declares-what-it-keeps", in = "bridge_unload-a-husk-stays-while-another-module-declares-what-it-keeps", claims = { matches = ["husk:husk@0\\.1\\.0: unloaded.*entities after the unload: 2\\b.*alive"] }, false = "BRIDGE_STRIP-a-husk-left-with-nothing-goes-at-the-unload" },
    { name = "destroy-that-leaves-a-husk-with-no-table-not-applied", in = "destroy-that-leaves-a-husk-with-no-table-not-applied", claims = { matches = ["module 'husk:husk@0\\.1\\.0': \\[budget\\] tables of 1 is used up. Not applied, of the changes it asked: [0-9]+.*alive"] }, false = "destroy-that-leaves-a-husk-with-a-table-applied" },
    { name = "destroy-that-leaves-a-husk-with-a-table-applied", in = "destroy-that-leaves-a-husk-with-a-table-applied", claims = { matches = ["husk:husk@0\\.1\\.0/look: found 2 3\\b.*alive"], lacks = ["is used up"] }, false = "destroy-that-leaves-a-husk-with-no-table-not-applied" },
    { name = "BRIDGE_DELETE-leaves-a-husk-for-a-component-that-another-module-keeps", in = "BRIDGE_DELETE-leaves-a-husk-for-a-component-that-another-module-keeps", claims = { matches = ["left 10 5.*game:keeper@0\\.1\\.0: unloaded.*left 0 5.*game:retype@0\\.1\\.0: loaded.*alive"] }, false = "BRIDGE_DELETE-unload-deletes" },
]
