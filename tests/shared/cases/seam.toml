[[case]]
name = "BACKEND_UNLOAD-library-gone-or-kept"
process = "state"
run = ["{out}/seam{exe}", "BACKEND_UNLOAD-library-gone-or-kept"]
claims = { matches = ["the guarded backend's library is still loaded, the plain backend's is gone.*alive"] }
false = { run = ["{out}/seam{exe}", "BACKEND_UNLOAD-unstated-library-kept"] }

[[case]]
name = "backend_destroy-the-library-leaves-the-process"
process = "state"
run = ["{out}/seam{exe}", "backend_destroy-the-library-leaves-the-process"]
