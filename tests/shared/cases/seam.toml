false = { run = ["{out}/seam{exe}", "BACKEND_UNLOAD-unstated-library-kept"] }

[[case]]
name = "config.threads-two-run-at-once"
alone = true
run = ["{out}/seam{exe}", "config.threads-two-run-at-once"]
claims = { matches = ["on 2 thread.s.[^a-z]*they ran at once.*alive"] }
false = { run = ["{out}/seam{exe}", "config.threads-one-runs-in-turn"] }

[[case]]
name = "config.threads-one-runs-in-turn"
