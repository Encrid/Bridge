code = ["include/**", "src/abi/abi.h", "src/abi/abi_declare.h", "src/abi/abi_subscribe.h", "src/backend/backend.h", "src/bridge/bridge_inside.h", "src/inside.h", "src/leaks.toml", "src/module/module.h", "src/pool/**", "src/reload/reload.h", "tests/backend/**", "tests/binding/**", "tests/modules/**", "tests/pool/**", "tests/seam/cases.h", "tests/seam/seam.manifest", "tests/seam/seam.rc", "tests/shared/**", "tests/support/backend_hollow.c", "tests/support/host.h", "tests/support/host_copy.h", "tests/support/plain_other_abi.c", "tests/support/plain_refusing_backend.c", "tests/support/plain_refusing_memory.c", "tests/support/posix/**", "tests/support/windows/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "pool"
run = ["{out}/pool{exe}"]
sweep = ["calloc", "os_event_create", "os_thread_start"]
claims = { status = 0 }
rows = [
    { name = "pool_run-with-2-jobs-and-1-worker-runs-each-job-one-time", in = "run 1 1 00", claims = { line = ["jobs run in each round: 2 of 2"] }, false = "run 1 1 000" },
    { name = "pool_run-keeps-each-pinned-job-on-the-caller", in = "run 2 1 0110", claims = { line = ["jobs run in each round: 4 of 4", "pinned jobs on the caller: 2 of 2"] }, false = "run 2 1 0100" },
    { name = "pool_run-with-1-job-runs-it-on-the-caller", in = "run 2 1 0", claims = { line = ["jobs run in each round: 1 of 1", "jobs on the caller: 1"] }, false = "run 2 1 00" },
    { name = "pool_run-with-no-worker-runs-each-job-on-the-caller", in = "run 0 1 000", claims = { line = ["jobs run in each round: 3 of 3", "jobs on the caller: 3"] }, false = "run 0 1 00" },
    { name = "pool_run-gives-2-jobs-that-wait-for-each-other-to-2-threads", in = "meet 1", claims = { line = ["the 2 jobs met"] }, false = "meet 0" },
    { name = "pool_run-with-more-workers-than-jobs-runs-each-job-one-time", in = "run 4 1 00", claims = { line = ["jobs run in each round: 2 of 2"] }, false = "run 4 1 000" },
    { name = "pool_run-in-3-rounds-runs-each-job-in-each-round", in = "run 1 3 00000", claims = { line = ["jobs run in each round: 5 of 5"] }, false = "run 1 3 0000" },
    { name = "pool_run-with-no-job-runs-nothing", in = "run 1 1", claims = { line = ["jobs run in each round: 0 of 0"] }, false = "run 1 1 0" },
    { name = "pool_destroy-with-no-pool-does-nothing", in = "none", claims = { line = ["no pool to end"] }, false = "other" },
    { name = "pool_create-with-each-refused-calloc-gives-nothing", in = "sweep calloc 2", claims = { order = ["calloc 1 refused: no pool", "calloc 2 refused: no pool", "calloc 3 refused: no pool", "3 refused calls of calloc, then a pool"] }, false = "sweep os_thread_start 2" },
    { name = "pool_create-with-each-refused-event-gives-nothing", in = "sweep os_event_create 2", claims = { order = ["os_event_create 1 refused: no pool", "os_event_create 2 refused: no pool", "os_event_create 3 refused: no pool", "3 refused calls of os_event_create, then a pool"] }, false = "sweep os_event_create 1" },
    { name = "pool_create-with-each-refused-thread-gives-nothing", in = "sweep os_thread_start 2", claims = { order = ["os_thread_start 1 refused: no pool", "os_thread_start 2 refused: no pool", "2 refused calls of os_thread_start, then a pool"] }, false = "sweep os_thread_start 1" },
]
