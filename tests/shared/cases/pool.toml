[[case]]
name = "pool_run-with-2-jobs-and-1-worker-runs-each-job-one-time"
run = ["{out}/pool{exe}", "run", "1", "1", "00"]
claims = { status = 0, line = ["jobs run in each round: 2 of 2"] }
false = { run = ["{out}/pool{exe}", "run", "1", "1", "000"] }

[[case]]
name = "pool_run-keeps-each-pinned-job-on-the-caller"
run = ["{out}/pool{exe}", "run", "2", "1", "0110"]
claims = { status = 0, line = ["jobs run in each round: 4 of 4", "pinned jobs on the caller: 2 of 2"] }
false = { run = ["{out}/pool{exe}", "run", "2", "1", "0100"] }

[[case]]
name = "pool_run-with-1-job-runs-it-on-the-caller"
run = ["{out}/pool{exe}", "run", "2", "1", "0"]
claims = { status = 0, line = ["jobs run in each round: 1 of 1", "jobs on the caller: 1"] }
false = { run = ["{out}/pool{exe}", "run", "2", "1", "00"] }

[[case]]
name = "pool_run-with-no-worker-runs-each-job-on-the-caller"
