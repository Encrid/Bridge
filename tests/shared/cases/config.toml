[[case]]
name = "BRIDGE_BOOL-seeds-a-bool"
run = ["{out}/seam{exe}", "BRIDGE_BOOL-seeds-a-bool"]
claims = { matches = ["vsync width 1 1280.*alive"] }
false = { run = ["{out}/seam{exe}", "BRIDGE_BOOL-false-seeded"] }

[[case]]
name = "BRIDGE_FLOAT-seeds-a-float"
run = ["{out}/seam{exe}", "BRIDGE_FLOAT-seeds-a-float"]
claims = { matches = ["scale mode 150 2.*alive"] }
false = { run = ["{out}/seam{exe}", "BRIDGE_FLOAT-another-scale-seeded"] }

[[case]]
name = "BRIDGE_ENUM-an-enum-a-field-names"
run = ["{out}/seam{exe}", "BRIDGE_ENUM-an-enum-a-field-names"]
claims = { matches = ["read: body 2 2.*read: more 3 4.*alive"] }
false = { run = ["{out}/seam{exe}", "BRIDGE_ENUM-undeclared-field-type-refused"] }

[[case]]
name = "BRIDGE_BITMASK-a-bitmask-a-field-names"
run = ["{out}/seam{exe}", "BRIDGE_BITMASK-a-bitmask-a-field-names"]
claims = { matches = ["read: body 2 2.*read: more 3 4.*alive"] }
false = { run = ["{out}/seam{exe}", "BRIDGE_BITMASK-undeclared-field-type-refused"] }

[[case]]
name = "module_config.setting-enum-of-no-constant-refused"
run = ["{out}/seam{exe}", "module_config.setting-enum-of-no-constant-refused"]
claims = { matches = ["did not load: its setting 'mode' is 3, which is no constant of the enum of the field it names.*alive"] }
false = { run = ["{out}/seam{exe}", "module_config.setting-enum-as-an-integer-taken"] }

[[case]]
name = "module_config.setting-bitmask-bit-of-no-constant-refused"
run = ["{out}/seam{exe}", "module_config.setting-bitmask-bit-of-no-constant-refused"]
claims = { matches = ["did not load: its setting 'flags' is 4, which has a bit that no constant of the bitmask of the field it names has.*alive"] }
false = { run = ["{out}/seam{exe}", "module_config.setting-bitmask-zero-taken"] }
