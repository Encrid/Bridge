[[case]]
name = "config-storage"
run = ["{out}/storage{exe}"]
claims = { status = 0 }
rows = [
    { name = "config-a-setting-of-a-kind-past-the-seeder-table-refused", in = "configbadkind", claims = { matches = ["kind 0: its setting 'setting' is a bool, and the field it names is of a type no setting fills.*kind 17: .*of a type no setting fills.*alive"] }, false = "ordersamephase" },
]

[[case]]
name = "config-sweeps"
run = ["{out}/storage{exe}"]
sweep = ["calloc", "malloc", "realloc"]
claims = { status = 0 }
rows = [
    { name = "each-calloc-refused-seeding-settings", in = "sweep nomemoryconfig calloc", claims = { order = ["-- calloc 81 refused", "out of memory: there was none for a module's share of the persistent arena", "no module 'game:settings@0.1.0' is loaded, so none is unloaded", "-- calloc 82 refused", "-- calloc 86 refused", "module 'game:settings@0.1.0' did not load: out of memory: there was none for the row of its settings", "no module 'game:settings@0.1.0' is loaded, so none is unloaded", "-- calloc 87 refused", "alive"], line = ["status 0"] }, false = "sweep nomemoryconfig malloc" },
    { name = "each-malloc-refused-seeding-settings", in = "sweep nomemoryconfig malloc", claims = { order = ["-- malloc 3 refused", "out of memory: there was none for the order a deployment states", "-- malloc 4 refused", "out of memory: there was none for the order a deployment states", "-- malloc 5 refused", "-- malloc 10 refused", "out of memory: there was none for a module's record", "-- malloc 11 refused", "-- malloc 41 refused", "out of memory: there was none for a share that stays: the arena loses its bytes", "-- malloc 42 refused", "out of memory: there was none for a share that stays: the arena loses its bytes", "-- malloc 43 refused", "alive"], line = ["status 0"] }, false = "sweep nomemoryconfig realloc" },
    { name = "each-realloc-refused-seeding-settings", in = "sweep nomemoryconfig realloc", claims = { order = ["-- realloc 16 refused", "out of memory: there was none for a module's share of the persistent arena", "no module 'game:settings@0.1.0' is loaded, so none is unloaded", "-- realloc 17 refused", "-- realloc 30 refused", "out of memory: there was none for a share that stays: the arena loses its bytes", "-- realloc 31 refused", "alive"], line = ["status 0"] }, false = "sweep nomemoryconfig calloc" },
]
