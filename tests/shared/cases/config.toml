code = ["include/**", "src/abi/**", "src/backend/**", "src/bits.h", "src/block/**", "src/bridge/bridge_backend.c", "src/bridge/bridge_backends.c", "src/bridge/bridge_calls.c", "src/bridge/bridge_check.c", "src/bridge/bridge_create.c", "src/bridge/bridge_destroy.c", "src/bridge/bridge_inside.h", "src/bridge/bridge_keys.c", "src/bridge/bridge_load.c", "src/bridge/bridge_phases.c", "src/bridge/bridge_reload.c", "src/bridge/bridge_run.c", "src/bridge/bridge_stop.c", "src/bridge/bridge_unload.c", "src/config/**", "src/hash.h", "src/inside.h", "src/leaks.toml", "src/module/**", "src/reload/reload.h", "src/reload/reload_check.c", "src/reload/reload_record.c", "src/reload/reload_rows.c", "src/reload/reload_share.c", "src/schedule/schedule.h", "src/schedule/schedule_account.c", "src/schedule/schedule_before.c", "src/schedule/schedule_bits.h", "src/schedule/schedule_build.c", "src/schedule/schedule_check.c", "src/schedule/schedule_closure.c", "src/schedule/schedule_commit.c", "src/schedule/schedule_conflict.c", "src/schedule/schedule_cross.c", "src/schedule/schedule_dispatch.c", "src/schedule/schedule_edges.c", "src/schedule/schedule_group.c", "src/schedule/schedule_jobs.c", "src/schedule/schedule_levels.c", "src/schedule/schedule_marks.c", "src/schedule/schedule_matrix.c", "src/schedule/schedule_names.c", "src/schedule/schedule_order.c", "src/schedule/schedule_run.c", "src/schedule/schedule_triggered.c", "src/schedule/schedule_unordered.c", "src/schedule/schedule_uses.c", "tests/backend/**", "tests/binding/**", "tests/modules/**", "tests/seam/**", "tests/shared/**", "tests/support/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "config-seam"
run = ["{out}/seam{exe}"]
claims = { status = 0 }
rows = [
    { name = "bridge_reload-new-settings-layout-stays-taken", in = "bridge_reload-new-settings-layout-stays-taken", claims = { matches = ["nine:first@0.2.0: reloaded.*which is already the settings of module 'nine:first@0.2.0'.*nine:second@0.1.0: not loaded.*nine:first@0.2.0/show: width 1280.*alive"], matches_not = ["width 7"] }, false = "bridge_reload-same-settings-layout-taken" },
    { name = "module_config.settings-kept-share-left-to-its-stem", in = "module_config.settings-kept-share-left-to-its-stem", claims = { matches = ["game:settings@0.1.0: unloaded.*game:third@0.1.0: loaded.*alive"], matches_not = ["did not load"] }, false = "module_config.settings-kept-share-and-a-third-of-the-whole-budget" },
    { name = "module_config.settings-kept-share-given-back", in = "module_config.settings-kept-share-given-back", claims = { matches = ["game:other@0.1.0: unloaded.*game:settings@0.1.0: loaded.*modules: game:settings@0.1.0=RUNNING \\(1\\).*alive"] }, false = "module_config.settings-kept-share-with-its-holder-loaded" },
    { name = "bridge_setting_t-key-handed-twice-refused", in = "bridge_setting_t-key-handed-twice-refused", claims = { matches = ["its setting 'title' is handed more than once.*game:settings@0.1.0: not loaded.*alive"] }, false = "bridge_setting_t-null-text-refused" },
    { name = "bridge_setting_t-null-text-refused", in = "bridge_setting_t-null-text-refused", claims = { matches = ["its setting 'path' is text, and its text is null.*game:settings@0.1.0: not loaded.*alive"] }, false = "bridge_setting_t-null-key-refused" },
    { name = "bridge_setting_t-null-key-refused", in = "bridge_setting_t-null-key-refused", claims = { matches = ["its setting 9 has no key.*game:settings@0.1.0: not loaded.*alive"] }, false = "bridge_setting_t-key-handed-twice-refused" },
    { name = "bridge_setting_t-no-kind-refused", in = "bridge_setting_t-no-kind-refused", claims = { matches = ["its setting 'vsync' has the kind 5, which is no kind of a setting.*not loaded.*alive"] }, false = "BRIDGE_INT-negative-for-a-bitmask-refused" },
    { name = "module_config.settings-of-every-kind", in = "module_config.settings-of-every-kind", claims = { matches = ["vsync width 1 1280.*scale mode 150 2.*show: hello 7 0.*show: some/long/path.cfg 0 0.*flags ratio 3 3.*show: big 2 0.*alive"] }, false = "setting.v-another-width-seeded" },
    { name = "BRIDGE_NO_CONFIG-with-settings-refused", in = "BRIDGE_NO_CONFIG-with-settings-refused", claims = { matches = ["it is handed 10 settings, and states that it has no config component.*alive"] }, false = "module_config.config-named-with-settings-loaded" },
    { name = "module_config.config-unset-refused", in = "module_config.config-unset-refused", claims = { matches = ["module 'game:settings@0.1.0' is refused: config is unset.*alive"] }, false = "module_config.config-stated-loaded" },
    { name = "module_config.config-undeclared-refused", in = "module_config.config-undeclared-refused", claims = { matches = ["its config is 'game:Nope', which is not a struct its init declared.*alive"] }, false = "module_config.config-declared-loaded" },
    { name = "module_config.settings-text-beyond-the-share-refused", in = "module_config.settings-text-beyond-the-share-refused", claims = { matches = ["its settings hold 24 bytes of text, and its persistent share has 8 left.*alive"] }, false = "module_config.settings-text-within-the-share-loaded" },
    { name = "module_config.config-taken-refused", in = "module_config.config-taken-refused", claims = { matches = ["its config is 'game:Settings', which is already the settings of module 'game:settings@0.1.0'.*alive"] }, false = "module_config.config-freed-by-an-unload-taken" },
    { name = "bridge_reload-settings-row-kept", in = "bridge_reload-settings-row-kept", claims = { matches = ["vsync width 1 1280.*game:settings@0.2.0: reloaded.*vsync width 1 1280.*alive"] }, false = "bridge_reload-settings-row-of-a-dropped-config" },
    { name = "module_config.settings-reseeded-in-place", in = "module_config.settings-reseeded-in-place", claims = { matches = ["settings text written to the same place.*alive"] }, false = "module_config.settings-reseed-beyond-the-share-refused" },
    { name = "module_config.config-not-a-singleton-refused", in = "module_config.config-not-a-singleton-refused", claims = { matches = ["did not load: its config is 'game:Settings', which is not declared a singleton.*alive"] }, false = "module_config.config-a-singleton-loaded" },
    { name = "bridge_setting_t-kind-zero-refused", in = "bridge_setting_t-kind-zero-refused", claims = { matches = ["did not load: its setting 'vsync' has the kind 0, which is no kind of a setting.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.settings-text-with-no-persistent-refused", in = "module_config.settings-text-with-no-persistent-refused", claims = { matches = ["did not load: its settings hold 24 bytes of text, and its persistent share has 0 left.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.config-an-enum-refused", in = "module_config.config-an-enum-refused", claims = { matches = ["did not load: its config is 'game:mode_t', which is not a struct its init declared.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.config-empty-refused", in = "module_config.config-empty-refused", claims = { matches = ["module 'test:ok@0\\.1\\.0' is refused: config is unset.*alive"] }, false = "module_config.config-none-loaded" },
    { name = "module_config.settings-refused-leave-a-kept-text-as-it-was", in = "module_config.settings-refused-leave-a-kept-text-as-it-was", claims = { matches = ["did not load: its setting 'small' is 300, which the field it names cannot hold.*game:other@0\\.1\\.0/show: some/long/path\\.cfg 0 0.*alive"] }, false = "module_config.settings-taken-write-a-kept-text-anew" },
    { name = "module_config.settings-taken-write-a-kept-text-anew", in = "module_config.settings-taken-write-a-kept-text-anew", claims = { matches = ["game:settings@0\\.1\\.0: unloaded.*game:settings@0\\.1\\.0: loaded.*game:other@0\\.1\\.0/show: fresh/path\\.cfg 0 0.*alive"], matches_not = ["did not load"] }, false = "module_config.settings-refused-leave-a-kept-text-as-it-was" },
    { name = "BRIDGE_INT-negative-for-a-bitmask-refused", in = "BRIDGE_INT-negative-for-a-bitmask-refused", claims = { matches = ["its setting 'flags' is -1, which the bitmask of the field it names cannot hold.*not loaded.*alive"] }, false = "bridge_setting_t-no-kind-refused" },
    { name = "setting.key-no-such-field-refused", in = "setting.key-no-such-field-refused", claims = { matches = ["its settings have a key 'vsynk', and 'game:Settings' has no field of that name.*alive"] }, false = "setting.key-a-field-of-that-name-seeded" },
    { name = "setting.kind-text-for-a-float-refused", in = "setting.kind-text-for-a-float-refused", claims = { matches = ["its setting 'scale' is text, and the field it names is a float.*alive"] }, false = "setting.kind-a-float-for-a-float-seeded" },
    { name = "BRIDGE_STRING-longer-than-the-field-refused", in = "BRIDGE_STRING-longer-than-the-field-refused", claims = { matches = ["its setting 'title' is 20 bytes of text, and the field it names holds 16 with the zero that ends it.*alive"] }, false = "BRIDGE_STRING-as-long-as-the-field-seeded" },
    { name = "BRIDGE_INT-beyond-the-field-refused", in = "BRIDGE_INT-beyond-the-field-refused", claims = { matches = ["its setting 'small' is 300, which the field it names cannot hold.*alive"] }, false = "BRIDGE_INT-the-most-the-field-holds-seeded" },
    { name = "BRIDGE_INT-beyond-the-enum-refused", in = "BRIDGE_INT-beyond-the-enum-refused", claims = { matches = ["its setting 'mode' is 200, which the enum of the field it names cannot hold.*alive"] }, false = "BRIDGE_INT-a-constant-of-the-enum-seeded" },
    { name = "BRIDGE_STRING-no-such-constant-refused", in = "BRIDGE_STRING-no-such-constant-refused", claims = { matches = ["its setting 'mode' is 'Sometimes', which the enum of the field it names has no constant for.*alive"] }, false = "BRIDGE_STRING-a-constant-name-seeded" },
    { name = "module_config.setting-enum-as-an-integer-taken", in = "module_config.setting-enum-as-an-integer-taken", claims = { matches = ["game:settings@0.1.0: loaded.*alive"], matches_not = ["did not load"] }, false = "module_config.setting-enum-out-of-range-refused" },
    { name = "module_config.setting-enum-out-of-range-refused", in = "module_config.setting-enum-out-of-range-refused", claims = { matches = ["did not load: its setting 'mode' is -200, which the enum of the field it names cannot hold.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-enum-as-a-bool-refused", in = "module_config.setting-enum-as-a-bool-refused", claims = { matches = ["did not load: its setting 'mode' is a bool, and the field it names is an enum.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-bitmask-as-a-bool-refused", in = "module_config.setting-bitmask-as-a-bool-refused", claims = { matches = ["did not load: its setting 'flags' is a bool, and the field it names is a bitmask.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-bitmask-out-of-range-refused", in = "module_config.setting-bitmask-out-of-range-refused", claims = { matches = ["did not load: its setting 'flags' is 4294967296, which the bitmask of the field it names cannot hold.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-bitmask-zero-taken", in = "module_config.setting-bitmask-zero-taken", claims = { matches = ["game:settings@0.1.0: loaded.*game:settings@0.1.0/show: flags ratio 0 3.*alive"], matches_not = ["did not load"] }, false = "module_config.setting-bitmask-out-of-range-refused" },
    { name = "module_config.setting-of-no-field-refused", in = "module_config.setting-of-no-field-refused", claims = { matches = ["did not load: its settings have a key 'titel', and 'game:Settings' has no field of that name.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-bool-as-an-integer-refused", in = "module_config.setting-bool-as-an-integer-refused", claims = { matches = ["did not load: its setting 'vsync' is an integer, and the field it names is a bool.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-bool-false-taken", in = "module_config.setting-bool-false-taken", claims = { matches = ["game:settings@0.1.0: loaded.*alive"], matches_not = ["did not load"] }, false = "module_config.setting-enum-out-of-range-refused" },
    { name = "module_config.setting-integer-out-of-range-refused", in = "module_config.setting-integer-out-of-range-refused", claims = { matches = ["did not load: its setting 'small' is -1, which the field it names cannot hold.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-integer-as-a-float-refused", in = "module_config.setting-integer-as-a-float-refused", claims = { matches = ["did not load: its setting 'width' is a float, and the field it names is an integer.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-text-as-an-integer-refused", in = "module_config.setting-text-as-an-integer-refused", claims = { matches = ["did not load: its setting 'path' is an integer, and the field it names is a struct, which only text into a bridge_text_t fills.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-char-array-as-an-integer-refused", in = "module_config.setting-char-array-as-an-integer-refused", claims = { matches = ["did not load: its setting 'title' is an integer, and the field it names is an array, which only text into a char array fills.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
    { name = "module_config.setting-enums-of-three-bases-taken", in = "module_config.setting-enums-of-three-bases-taken", claims = { matches = ["game:settings@0.1.0: loaded.*alive"], matches_not = ["did not load"] }, false = "module_config.setting-enum-of-uint8-below-zero-refused" },
    { name = "module_config.setting-enum-of-uint8-below-zero-refused", in = "module_config.setting-enum-of-uint8-below-zero-refused", claims = { matches = ["did not load: its setting 'eu8' is -1, which the enum of the field it names cannot hold.*alive"] }, false = "module_config.setting-enums-of-three-bases-taken" },
    { name = "module_config.setting-enum-of-uint8-past-255-refused", in = "module_config.setting-enum-of-uint8-past-255-refused", claims = { matches = ["did not load: its setting 'eu8' is 256, which the enum of the field it names cannot hold.*alive"] }, false = "module_config.setting-enums-of-three-bases-taken" },
    { name = "module_config.setting-bitmask-of-64-bits-taken", in = "module_config.setting-bitmask-of-64-bits-taken", claims = { matches = ["game:settings@0.1.0: loaded.*alive"], matches_not = ["did not load"] }, false = "BRIDGE_INT-bit-63-for-a-bitmask-of-64-bits-refused" },
    { name = "BRIDGE_INT-bit-63-for-a-bitmask-of-64-bits-refused", in = "BRIDGE_INT-bit-63-for-a-bitmask-of-64-bits-refused", claims = { matches = ["did not load: its setting 'mask64' is -9223372036854775808, which the bitmask of the field it names cannot hold.*alive"] }, false = "module_config.setting-bitmask-of-64-bits-taken" },
    { name = "module_config.setting-text-into-a-text-array-refused", in = "module_config.setting-text-into-a-text-array-refused", claims = { matches = ["did not load: its setting 'names' is text, and the field it names is an array, which only text into a char array fills.*alive"] }, false = "module_config.setting-enums-of-three-bases-taken" },
    { name = "module_config.setting-into-a-struct-field-refused", in = "module_config.setting-into-a-struct-field-refused", claims = { matches = ["did not load: its setting 'pair' is an integer, and the field it names is a struct, which only text into a bridge_text_t fills.*alive"] }, false = "module_config.setting-enums-of-three-bases-taken" },
    { name = "bridge_value_t-a-value-of-each-kind", in = "bridge_value_t-a-value-of-each-kind", claims = { matches = ["vsync width 1 1280.*scale mode 150 2.*show: hello 7 0.*show: some/long/path.cfg 0 0.*flags ratio 3 3.*show: big 2 0.*alive"] }, false = "setting.v-another-width-seeded" },
    { name = "setting.v-seeds-the-field-its-key-names", in = "setting.v-seeds-the-field-its-key-names", claims = { matches = ["vsync width 1 1280.*alive"] }, false = "setting.v-another-width-seeded" },
    { name = "BRIDGE_BOOL-seeds-a-bool", in = "BRIDGE_BOOL-seeds-a-bool", claims = { matches = ["vsync width 1 1280.*alive"] }, false = "BRIDGE_BOOL-false-seeded" },
    { name = "BRIDGE_FLOAT-seeds-a-float", in = "BRIDGE_FLOAT-seeds-a-float", claims = { matches = ["scale mode 150 2.*alive"] }, false = "BRIDGE_FLOAT-another-scale-seeded" },
    { name = "BRIDGE_ENUM-an-enum-a-field-names", in = "BRIDGE_ENUM-an-enum-a-field-names", claims = { matches = ["read: body 2 2.*read: more 3 4.*alive"] }, false = "BRIDGE_ENUM-undeclared-field-type-refused" },
    { name = "BRIDGE_BITMASK-a-bitmask-a-field-names", in = "BRIDGE_BITMASK-a-bitmask-a-field-names", claims = { matches = ["read: body 2 2.*read: more 3 4.*alive"] }, false = "BRIDGE_BITMASK-undeclared-field-type-refused" },
    { name = "module_config.setting-enum-of-no-constant-refused", in = "module_config.setting-enum-of-no-constant-refused", claims = { matches = ["did not load: its setting 'mode' is 3, which is no constant of the enum of the field it names.*alive"] }, false = "module_config.setting-enum-as-an-integer-taken" },
