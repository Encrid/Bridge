[[case]]
name = "storage-alone"
run = ["{out}/storage{exe}"]
alone = true
claims = { status = 0 }
rows = [
    { name = "storage-weigh", in = "weigh", claims = { matches = ["an entity of 4096 bytes.*in    1 table.*in 4096 tables.*a sparse set.*of 4096 bytes.*a toggle, one row in 16 on.*direct-indexed.*in no order.*as tags.*a singleton read.*a toggled row switched.*alive"], lacks = ["FAIL"] }, false = "toggle" },
    { name = "storage-baseline", in = "baseline", claims = { matches = ["read in order.*in no order.*204800 of them on.*found through its query.*alive"], lacks = ["FAIL"] }, false = "measure" },
    { name = "storage-measure", in = "measure", claims = { matches = ["an id handed out +[0-9.]+ ns each.*ten thousand tables made.*the stress run, on 1 thread.*a phase of a thousand modules, on 1 thread +[0-9.]+ us.*a barrier of a thousand idle modules +[0-9.]+ us.*a barrier after a thousand queued changes +[0-9.]+ us.*a load beside a thousand modules +[0-9.]+ us.*an unload beside a thousand modules +[0-9.]+ us.*a barrier after one changed table beside a thousand modules +[0-9.]+ us.*a phase of a thousand modules, on 6 threads +[0-9.]+ us.*alive"] }, false = "stress1" },
]
