claims = { output = "tests/storage/storage_changes.txt" }
false = { run = ["{out}/storage{exe}", "shape"] }

[[case]]
name = "memory_get_shape-the-block-reserved-as-asked"
run = ["{out}/storage{exe}", "shape"]
claims = { matches = ["the shared block reserves more than it uses: yes.*a plain module's private block reserves what it uses: yes.*the shared block is whole guarded pages: yes.*a plain module's private block is not rounded to one: yes.*alive"] }
false = { run = ["{out}/storage{exe}", "changes"] }

[[case]]
name = "schedule_init_matrix-too-large-not-made"
run = ["{out}/storage{exe}", "matrix"]
claims = { matches = ["a matrix for 4294967233 systems: not made, 67108864 words a row.*alive"] }
false = { run = ["{out}/storage{exe}", "matrixsmall"] }

[[case]]
name = "bridge_log_record_t-place-and-slot-past-16-bits"
run = ["{out}/storage{exe}", "widerecord"]
claims = { matches = ["barriers 7 place 70000 system far.*alive"] }
false = { run = ["{out}/storage{exe}", "matrix"] }

[[case]]
name = "bridge_query_t-at-that-a-module-writes-is-not-read"
run = ["{out}/storage{exe}", "pointaway"]
claims = { matches = ["outside spans \\[\\d+, \\d+\\): wrote 0 at \\d+.*alive"] }
false = { run = ["{out}/storage{exe}", "shape"] }

[[case]]
name = "bridge_budget_t-types-past-a-count-of-32-bits-refused"
run = ["{out}/storage{exe}", "manytypes"]
claims = { matches = ["types of 4294967295, rounded up to a multiple of 64, is more than a count of 32 bits holds.*the budget was refused.*alive"] }
false = { run = ["{out}/storage{exe}", "manyall"] }

[[case]]
name = "bridge_budget_t-tables-sparse_sets-and-types-past-a-count-of-32-bits-refused"
run = ["{out}/storage{exe}", "manyall"]
claims = { matches = ["tables, sparse_sets and types come to \\d+, which is more than a count of 32 bits holds.*the budget was refused.*alive"] }
false = { run = ["{out}/storage{exe}", "manytypes"] }

[[case]]
name = "bridge_reload-65-replaced-types-carried-across"
run = ["{out}/storage{exe}", "manymove"]
claims = { matches = ["reload: done.*after the reload: 65 types, 65 of them carried by each of the 4 entities.*alive"] }
false = { run = ["{out}/storage{exe}", "shape"] }

[[case]]
name = "storage_give_single-tells-only-its-type-attached"
run = ["{out}/storage{exe}", "twosingles"]
claims = { matches = ["A observer heard ON_ATTACH when B got its value: 0\\s.*alive"] }
false = { run = ["{out}/storage{exe}", "shape"] }

[[case]]
name = "observer-list-past-the-spans-names-the-observer"
run = ["{out}/storage{exe}", "fulllist"]
claims = { matches = ["is stopped: the list of its observer 'heard' no longer fits in its spans of 256 bytes.*alive"] }
false = { run = ["{out}/storage{exe}", "shape"] }

[[case]]
name = "schedule_build-levels-of-a-chain-in-two-rounds"
run = ["{out}/storage{exe}", "levels"]
claims = { matches = ["levels: 100 systems in one phase, built: set_levels tested reach 19800 times, last level 99.*alive"] }
false = { run = ["{out}/storage{exe}", "shape"] }

[[case]]
name = "bridge_reload-share-grown-within-eight-bytes-takes-no-range"
run = ["{out}/storage{exe}", "ranges"]
claims = { matches = ["ranges: 2 when loaded, reload done, 2 after it, 0 after the unloads.*alive"] }
false = { run = ["{out}/storage{exe}", "levels"] }
