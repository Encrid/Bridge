[[case]]
name = "a config named with only a backslash"
run = ["{out}/bridge-host{exe}", "no-such-dir-98765\\deep.toml"]

[case.claims]
status = 1
has = ["cannot go into '"]

[case.false]
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/none.toml"]

[[case]]
name = "a config whose backslash comes before a slash"
run = ["{out}/bridge-host{exe}", "{case}/no\\such/deep.toml"]

[case.claims]
status = 1
has = ["cannot go into '"]

[case.false]
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/none.toml"]

[[case]]
name = "a world that states no phases but states its counts"
run = ["{out}/bridge-host{exe}", "{case}/np.toml"]

[case.claims]
status = 1
has = ["not stated: phases"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/np.toml" = '''
presets = ["{root}/tests/host/world.toml", "{root}/tests/host/wasm.toml", "{root}/tests/host/native.toml"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/np.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "a table for an unfound module, beside a non-module file"
run = ["{out}/bridge-host{exe}", "{case}/uf.toml"]

[case.claims]
status = 1
has = [
    "refused: uf.toml:4: bridge-host:nobody@1.0.0: no module found is it",
    "found: bridge-host:quiet@1.0.0",
]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/cq/junk.txt" = "not a module"
"{case}/uf.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[module."bridge-host:nobody@1.0.0"]
hot_reload = false
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/uf.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''
