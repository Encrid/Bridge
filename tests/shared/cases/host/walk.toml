[[case]]
name = "ignores that match a folder exactly, by prefix, and not at a boundary"
run = ["{out}/bridge-host{exe}", "{case}/ig.toml"]

[case.claims]
status = 0
has = [
    "record[6] bridge-host:quiet@1.0.0/say: said once 1 0",
    "not a module: prex/y.txt",
]

[case.folders]
"{case}/base" = ["quiet"]
"{case}/base/skip" = []

[case.files]
"{case}/base/empty.wasm" = ""
"{case}/pre/x.txt" = "junk"
"{case}/prex/y.txt" = "junk"
"{case}/ig.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["base", "pre", "prex"]
ignore = ["base/skip", "pre"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/ig.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["base"]
ignore = ["base"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "a content path that names a single file"
run = ["{out}/bridge-host{exe}", "{case}/sf.toml"]

[case.claims]
status = 0
has = ["record[6] bridge-host:quiet@1.0.0/say: said once 1 0"]

[case.folders]
"{case}/mods" = ["quiet"]

[case.files]
"{case}/sf.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods/quiet.wasm"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/sf.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods/none.wasm"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

