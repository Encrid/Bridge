[[case]]
name = "manifests that the reader refuses, word by word"
run = ["{out}/bridge-host{exe}", "{case}/mf.toml"]

[case.claims]
status = 0
has = [
    "not a module: bad/nocolon.wasm: its manifest does not begin with who it is",
    "not a module: bad/nocat.wasm: its manifest does not begin with who it is",
    "not a module: bad/firsteq.wasm: its manifest does not begin with who it is",
    "not loaded: bad/bareword.wasm: bw:x@1 states a bareword that cannot be",
    "not loaded: bad/longword.wasm: lw:x@1 its manifest holds a word that is too long",
    "not a module: bad/longid.wasm: its manifest holds a word that is too long",
    "not loaded: bad/emptyabi.wasm: ea:x@1 states a abi that cannot be",
    "not loaded: bad/longconfig.wasm: lc:x@1 states a config that cannot be",
    "not loaded: bad/badflag.wasm: bf:x@1 states a pinned that cannot be",
]

[case.folders]
"{case}/bad" = ["nocolon", "nocat", "firsteq", "bareword", "longword", "longid", "emptyabi", "badabi", "negabi", "relfirst", "longconfig", "badflag"]

[case.files]
"{case}/mf.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["bad"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.folders]
"{case}/bad" = ["quiet"]
