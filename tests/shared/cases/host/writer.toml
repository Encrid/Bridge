[[case]]
name = "a reload that is refused"
run = ["{out}/bridge-host{exe}", "{case}/fr.toml"]
script = [{ wait = "? go on", put = { "{case}/fr/swap.wasm" = "word" }, type = "go" }]

[case.claims]
status = 1
has = [
    "bridge-host:word@1.0.0: not stated: config.word",
    "bridge-host:word@1.0.0 was refused",
]

[case.folders]
"{case}/fr" = ["wait", "swap"]

[case.files]
"{case}/fr.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 16
[module."bridge-host:swap@1.0.0"]
hot_reload = true
[content]
paths = ["fr"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

