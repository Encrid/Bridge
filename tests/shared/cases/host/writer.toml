[[case]]
name = "usage when no config is named"
run = ["{out}/bridge-host{exe}"]

[case.claims]
status = 2
has = ["usage: bridge-host <config.toml>"]

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "a config whose folder is not there"
run = ["{out}/bridge-host{exe}", "{case}/gone/deep.toml"]

[case.claims]
status = 1
has = ["cannot go into '"]

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "a config that cannot be read"
run = ["{out}/bridge-host{exe}", "{case}/missing.toml"]

[case.claims]
status = 1
has = ["cannot read '"]

[case.false]
run = ["{out}/bridge-host{exe}"]

[[case]]
name = "presets that are not a list of files"
run = ["{out}/bridge-host{exe}", "{case}/plist.toml"]

[case.claims]
status = 1
line = ["refused: plist.toml:1: presets: a list of files"]

[case.files]
"{case}/plist.toml" = '''
presets = "nope"
[content]
paths = ["cq"]
'''

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "no backend is stated"
run = ["{out}/bridge-host{exe}", "{case}/noback.toml"]

[case.claims]
status = 1
has = ["not stated: backend"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/noback.toml" = '''
presets = ["{root}/tests/host/world.toml"]
phases = ["update"]
rounds = 1
[content]
paths = ["cq"]
'''

[case.false.files]
"{case}/noback.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 1
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "the config said, in full"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/show.toml"]

[case.claims]
status = 1
has = [
    ", over peer.toml:1",
    "content.ignore: skip-me",
    "order: bridge-host:word:say before bridge-host:other:say",
    "phases.late",
    "it takes no config.bogus, stated in",
    ".d/local.toml",
]

[case.folders]
"{case}/cw" = ["word"]

[case.files]
"{case}/peer.toml" = '''
rounds = 8
'''
"{case}/show.toml.d/local.toml" = '''
[module."bridge-host:word@1.0.0".config]
word = "local"
'''
"{case}/show.toml" = '''
presets = ["{root}/tests/host/test.toml", "peer.toml"]
phases = ["late"]
rounds = 8
[module."bridge-host:word@1.0.0".phases]
late = "update"
[module."bridge-host:word@1.0.0".config]
word = "hi"
bogus = 1
[content]
paths = ["cw"]
ignore = ["skip-me"]
[order]
before = [["bridge-host:word:say", "bridge-host:other:say"]]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false]
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/plain.toml"]

[case.false.files]
"{case}/plain.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 1
[module."bridge-host:word@1.0.0".config]
word = "hi"
[content]
paths = ["cw"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "the lock folder is a file"
run = ["{out}/bridge-host{exe}", "{case}/lf.toml"]

[case.claims]
status = 1
