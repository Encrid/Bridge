presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[order]
before = [["a", "b"], ["a", "c"], ["c", "d"], ["b", "a"], ["c", "a"]]
[content]
paths = ["cq"]
[backend]
