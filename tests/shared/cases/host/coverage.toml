[[case]]
name = "every module key the check refuses"
run = ["{out}/bridge-host{exe}", "{case}/mod.toml"]

[case.claims]
status = 1
has = [
    'module."foo:bar".trusted: a module is named with its version',
    "module.baz.trusted: no backend of that name",
    'module."x:y@1".nokey: no key of a module',
    "module.all.config.foo: a setting is stated for one module, by its identity",
    'module."p:q@1".config.aa.bad: a setting is a value, or { path = "..." }',
    'module."t:u@1".config.d.e.f: a setting is a value, or { path = "..." }',
    'module."v:w@1".thing.k: no key of a module',
    'module."c:d@1".more.sub.y: no key of a module',
    "module.zz: no key of Bridge-Host's or Bridge's",
]

[case.files]
"{case}/mod.toml" = '''
module.zz = 1
[module."foo:bar"]
trusted = true
[module.baz]
trusted = true
[module."x:y@1"]
nokey = 1
[module.all.config]
foo = 1
[module."p:q@1".config.aa]
path = "p"
bad = 1
[module."t:u@1".config.d.e]
f = 1
[module."v:w@1".thing]
k = 1
[module."c:d@1".more.sub]
y = 1
'''

[case.false.files]
"{case}/mod.toml" = '''
rounds = 1
'''

[[case]]
name = "world budget backend content order keys refused"
run = ["{out}/bridge-host{exe}", "{case}/bw.toml"]

[case.claims]
status = 1
has = [
    "bogus: no key of Bridge-Host's or Bridge's",
    "budget: no key of Bridge-Host's or Bridge's",
    "backend: no key of Bridge-Host's or Bridge's",
    "content: no key of Bridge-Host's or Bridge's",
    "order: no key of Bridge-Host's or Bridge's",
    "checks: no key of Bridge-Host's or Bridge's",
]

[case.files]
"{case}/bw.toml" = '''
bogus = 1
budget = 1
backend = 2
content = 3
order = 4
checks = 5
'''

[case.false.files]
"{case}/bw.toml" = '''
rounds = 1
'''

[[case]]
name = "deeper content and order keys refused, and an empty table"
run = ["{out}/bridge-host{exe}", "{case}/bk.toml"]

[case.claims]
status = 1
has = [
    "content.foo.bar: no key of Bridge-Host's or Bridge's",
    "order.after: no key of Bridge-Host's or Bridge's",
    "checks.bogus: no key of Bridge-Host's or Bridge's",
    "empty: a table with nothing in it",
]

[case.files]
"{case}/bk.toml" = '''
content.load.all.deep = 1
content.foo.bar = 2
order.after = 3
checks.bogus = 1
[empty]
'''

[case.false.files]
"{case}/bk.toml" = '''
