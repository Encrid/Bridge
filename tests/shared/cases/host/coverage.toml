'''

[[case]]
name = "the local file states what is fixed when the world is made"
run = ["{out}/bridge-host{exe}", "{case}/lcl.toml"]

[case.claims]
status = 1
has = [
    "rounds: fixed when the world is made: not in the local file",
    "budget.entities: fixed when the world is made: not in the local file",
    "backend.wasm: fixed when the world is made: not in the local file",
    "checks.profile: fixed when the world is made: not in the local file",
]

[case.files]
"{case}/lcl.toml" = '''
rounds = 1
'''
"{case}/lcl.toml.d/local.toml" = '''
rounds = 1
[budget]
entities = 1
[backend]
wasm = "y"
[checks]
profile = true
'''

[case.false.files]
"{case}/lcl.toml.d/local.toml" = '''
[module."bridge-host:word@1.0.0".config]
word = "local"
'''

[[case]]
name = "a preset named twice and an empty preset"
run = ["{out}/bridge-host{exe}", "{case}/dia.toml"]

[case.claims]
status = 0
line = ["record[6] bridge-host:quiet@1.0.0/say: said once 1 0"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/da.toml" = '''
presets = ["dc.toml"]
'''
"{case}/db.toml" = '''
presets = ["dc.toml"]
'''
"{case}/dc.toml" = '''
'''
"{case}/empty.toml" = ""
"{case}/dia.toml" = '''
presets = ["{root}/tests/host/test.toml", "da.toml", "db.toml", "empty.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/dia.toml" = '''
presets = ["{root}/tests/host/test.toml", "da.toml", "db.toml", "empty.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
'''

