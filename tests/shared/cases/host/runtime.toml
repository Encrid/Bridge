[[case]]
name = "keys that are not bare and a key too long to render"
run = ["{out}/bridge-host{exe}", "{case}/sk.toml"]

[case.claims]
status = 1
has = ["\"@weird\": no key of Bridge-Host's or Bridge's"]

[case.files]
"{case}/sk.toml" = '''
"@weird" = 1
aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc.dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd = 2
'''

[case.false.files]
"{case}/sk.toml" = '''
rounds = 1
'''
