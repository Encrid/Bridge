[[case]]
name = "a backend stated two ways"
run = ["{out}/bridge-host{exe}", "{case}/bconf.toml"]

[case.claims]
status = 1
has = ["refused: backend.wasm: "]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/bc1.toml" = '''
[backend]
wasm = "a"
'''
"{case}/bc2.toml" = '''
[backend]
wasm = "b"
'''
"{case}/bconf.toml" = '''
presets = ["{root}/tests/host/world.toml", "{root}/tests/host/wasm.toml", "bc1.toml", "bc2.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
'''

[case.false.files]
"{case}/bc2.toml" = '''
'''
"{case}/bconf.toml" = '''
presets = ["{root}/tests/host/test.toml", "bc2.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "a backend path shorter than the library suffix"
run = ["{out}/bridge-host{exe}", "{case}/bshort.toml"]

[case.claims]
status = 1
has = ["cannot open backend library"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/bshort.toml" = '''
presets = ["{root}/tests/host/world.toml", "{root}/tests/host/wasm.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "/x"
'''

[case.false.files]
"{case}/bshort.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "one backend fails before another is taken"
run = ["{out}/bridge-host{exe}", "{case}/bfo.toml"]

[case.claims]
status = 1
has = ["not stated: content.arrive.aa"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/bfo.toml" = '''
presets = ["{root}/tests/host/world.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[content.arrive]
zz = "load"
[backend]
aa = "x"
zz = "y"
'''

[case.false.files]
"{case}/bfo.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[[case]]
name = "a module whose load nobody states"
run = ["{out}/bridge-host{exe}", "{case}/noload.toml"]

[case.claims]
status = 1
has = ["not stated: content.load.all"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/nolworld.toml" = '''
threads = 1
live = false
[budget]
entities = 8192
tables = 8
types = 16
systems = 16
terms = 8
modules = 8
persistent = 262144
columns = 1048576
sparse_sets = "none"
direct_indexed = "none"
[module.all]
hot_reload = false
on_error = "skip"
max_system_failures = 3
log_level = 7
scratch = 65536
log_ring = 6144
spans = 16384
spawns = "none"
persistent = "none"
changes = 1048576
losses = "none"
'''
"{case}/noload.toml" = '''
presets = ["{case}/nolworld.toml", "{root}/tests/host/wasm.toml", "{root}/tests/host/native.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

[case.false.files]
"{case}/noload.toml" = '''
presets = ["{root}/tests/host/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
native = "{out}/backends/bridge_native"
'''

