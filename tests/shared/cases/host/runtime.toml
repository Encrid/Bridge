'''
"{case}/ncc.toml" = '''
rounds = 3
'''
"{case}/ncsilent.toml" = '''
threads = 1
'''
"{case}/nca.toml" = '''
presets = ["ncb.toml", "ncc.toml", "ncsilent.toml"]
'''
"{case}/nc.toml" = '''
presets = ["{root}/tests/host/world.toml", "{root}/tests/host/wasm.toml", "{root}/tests/host/native.toml", "nca.toml"]
phases = ["update"]
[content]
paths = ["cq"]
[backend]
wasm = "{out}/backends/bridge_wasm"
