[[case]]
name = "the variable aligned of each target starts a function at a multiple of 64 bytes, and a loop too, except on aarch64-windows-gnu"
run = ["{python}", "-c", "import argparse\nimport subprocess\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nimport shared\nroot = Path(sys.argv[2])\ncase = Path(sys.argv[3])\ndef at_64(lines, place):\n    for line in reversed(lines[:place]):\n        words = line.split()\n        if words and words[0] == '.p2align':\n            return words[1].rstrip(',') == '6'\n        if words and not words[0].startswith(('.', '#', '//', ';')):\n            return False\n    return False\nfor target in shared.config(root)['targets']:\n    config, values = build.prepared(argparse.Namespace(root=root, target=target, debug=False, out=None, set=[], part=None))\n    made = case / (target + '.s')\n    subprocess.run([values['zig'], 'cc', '-target', values['triple'], '-mcpu=' + values['cpu'], *values['optimize'], *values[sys.argv[4]], '-Wno-unused-command-line-argument', '-S', case / 'walk.c', '-o', made], check=True)\n    lines = made.read_text().splitlines()\n    starts = [place for place, line in enumerate(lines) if line.split()[:1] in (['walk:'], ['_walk:'])]\n    loops = [place for place, line in enumerate(lines) if 'Loop Header' in line]\n    print(target, 'function at 64:', 'yes' if starts and all(at_64(lines, place) for place in starts) else 'no')\n    print(target, 'loops at 64:', 'yes' if loops and all(at_64(lines, place) for place in loops) else 'no')", "{root}/.toolchain/tools", "{root}", "{case}", "aligned"]
files = { "{case}/walk.c" = "struct node\n{\n    struct node *next;\n    int value;\n};\n\nint walk(const struct node *n)\n{\n    int s = 0;\n    for (; n; n = n->next)\n        s += n->value;\n    return s;\n}\n" }
claims = { line = ["x86_64-windows-gnu function at 64: yes", "x86_64-linux-gnu function at 64: yes", "aarch64-macos function at 64: yes", "aarch64-linux-gnu function at 64: yes", "x86_64-macos function at 64: yes", "aarch64-windows-gnu function at 64: yes", "x86_64-windows-gnu loops at 64: yes", "x86_64-linux-gnu loops at 64: yes", "aarch64-macos loops at 64: yes", "aarch64-linux-gnu loops at 64: yes", "x86_64-macos loops at 64: yes"] }
false = { run = ["{python}", "-c", "import argparse\nimport subprocess\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nimport shared\nroot = Path(sys.argv[2])\ncase = Path(sys.argv[3])\ndef at_64(lines, place):\n    for line in reversed(lines[:place]):\n        words = line.split()\n        if words and words[0] == '.p2align':\n            return words[1].rstrip(',') == '6'\n        if words and not words[0].startswith(('.', '#', '//', ';')):\n            return False\n    return False\nfor target in shared.config(root)['targets']:\n    config, values = build.prepared(argparse.Namespace(root=root, target=target, debug=False, out=None, set=[], part=None))\n    made = case / (target + '.s')\n    subprocess.run([values['zig'], 'cc', '-target', values['triple'], '-mcpu=' + values['cpu'], *values['optimize'], *values[sys.argv[4]], '-Wno-unused-command-line-argument', '-S', case / 'walk.c', '-o', made], check=True)\n    lines = made.read_text().splitlines()\n    starts = [place for place, line in enumerate(lines) if line.split()[:1] in (['walk:'], ['_walk:'])]\n    loops = [place for place, line in enumerate(lines) if 'Loop Header' in line]\n    print(target, 'function at 64:', 'yes' if starts and all(at_64(lines, place) for place in starts) else 'no')\n    print(target, 'loops at 64:', 'yes' if loops and all(at_64(lines, place) for place in loops) else 'no')", "{root}/.toolchain/tools", "{root}", "{case}", "hidden"] }

[[case]]
name = "zig stops when it aligns a loop of aarch64-windows-gnu, so its variable aligned holds no flag for loops"
run = ["{python}", "-c", "import argparse\nimport subprocess\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nconfig, values = build.prepared(argparse.Namespace(root=Path(sys.argv[2]), target=sys.argv[4], debug=False, out=None, set=[], part=None))\ncase = Path(sys.argv[3])\ndone = subprocess.run([values['zig'], 'cc', '-target', values['triple'], '-mcpu=' + values['cpu'], *values['optimize'], *values['aligned'], *sys.argv[5:], '-fno-crash-diagnostics', '-Wno-unused-command-line-argument', '-c', case / 'loop.c', '-o', case / 'loop.o'], capture_output=True, text=True)\nprint('refused' if done.returncode else 'built')\nprint(done.stderr)", "{root}/.toolchain/tools", "{root}", "{case}", "aarch64-windows-gnu", "-falign-loops=64"]
files = { "{case}/loop.c" = "int step(int value);\n\nint walk(int count)\n{\n    int s = 0;\n    for (int i = 0; i < count; i++)\n        s += step(i);\n    return s;\n}\n" }
claims = { line = ["refused"], has = ["Failed to evaluate function length in SEH unwind info"] }
false = { run = ["{python}", "-c", "import argparse\nimport subprocess\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nconfig, values = build.prepared(argparse.Namespace(root=Path(sys.argv[2]), target=sys.argv[4], debug=False, out=None, set=[], part=None))\ncase = Path(sys.argv[3])\ndone = subprocess.run([values['zig'], 'cc', '-target', values['triple'], '-mcpu=' + values['cpu'], *values['optimize'], *values['aligned'], *sys.argv[5:], '-fno-crash-diagnostics', '-Wno-unused-command-line-argument', '-c', case / 'loop.c', '-o', case / 'loop.o'], capture_output=True, text=True)\nprint('refused' if done.returncode else 'built')\nprint(done.stderr)", "{root}/.toolchain/tools", "{root}", "{case}", "aarch64-windows-gnu"] }
