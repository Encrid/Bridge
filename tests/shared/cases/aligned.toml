[[case]]
name = "each test artifact gets the flags of the variable aligned"
run = ["{python}", "-c", "import argparse\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nimport shared\nconfig, values = build.prepared(argparse.Namespace(root=Path(sys.argv[2]), target=sys.argv[3], debug=False, out=None, set=[], part=None))\nwanted = values['aligned']\nfor artifact in build.artifacts(config):\n    if bool(artifact.get('test')) == (sys.argv[4] == 'tested'):\n        flags = shared.expanded(artifact.get('flags', []), values)\n        print('aligned' if wanted and all(flag in flags for flag in wanted) else 'plain', artifact['name'])", "{root}/.toolchain/tools", "{root}", "{target}", "tested"]
claims = { line = ["aligned storage", "aligned bridge_tests", "aligned sparsebig"], lacks = ["plain "] }
