[[case]]
name = "the flags of the variable aligned start a function and its loop at a multiple of 64 bytes"
run = ["{python}", "-c", "import argparse\nimport subprocess\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nconfig, values = build.prepared(argparse.Namespace(root=Path(sys.argv[2]), target=sys.argv[3], debug=False, out=None, set=[], part=None))\ncase = Path(sys.argv[4])\nsubprocess.run([values['zig'], 'cc', '-target', values['triple'], '-mcpu=' + values['cpu'], *values['optimize'], *values[sys.argv[5]], '-Wno-unused-command-line-argument', '-S', case / 'walk.c', '-o', case / 'walk.s'], check=True)\nlines = (case / 'walk.s').read_text().splitlines()\ndef at_64(place):\n    for line in reversed(lines[:place]):\n        words = line.split()\n        if words and words[0] == '.p2align':\n            return words[1].rstrip(',') == '6'\n        if words and not words[0].startswith(('.', '#', '//', ';')):\n            return False\n    return False\nstarts = [place for place, line in enumerate(lines) if line.split()[:1] in (['walk:'], ['_walk:'])]\nloops = [place for place, line in enumerate(lines) if 'Loop Header' in line]\nprint('function at 64:', 'yes' if starts and all(at_64(place) for place in starts) else 'no')\nprint('loops at 64:', 'yes' if loops and all(at_64(place) for place in loops) else 'no')", "{root}/.toolchain/tools", "{root}", "{target}", "{case}", "aligned"]
files = { "{case}/walk.c" = "struct node\n{\n    struct node *next;\n    int value;\n};\n\nint walk(const struct node *n)\n{\n    int s = 0;\n    for (; n; n = n->next)\n        s += n->value;\n    return s;\n}\n" }
claims = { line = ["function at 64: yes", "loops at 64: yes"] }
false = { run = ["{python}", "-c", "import argparse\nimport subprocess\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, sys.argv[1])\nimport build\nconfig, values = build.prepared(argparse.Namespace(root=Path(sys.argv[2]), target=sys.argv[3], debug=False, out=None, set=[], part=None))\ncase = Path(sys.argv[4])\nsubprocess.run([values['zig'], 'cc', '-target', values['triple'], '-mcpu=' + values['cpu'], *values['optimize'], *values[sys.argv[5]], '-Wno-unused-command-line-argument', '-S', case / 'walk.c', '-o', case / 'walk.s'], check=True)\nlines = (case / 'walk.s').read_text().splitlines()\ndef at_64(place):\n    for line in reversed(lines[:place]):\n        words = line.split()\n        if words and words[0] == '.p2align':\n            return words[1].rstrip(',') == '6'\n        if words and not words[0].startswith(('.', '#', '//', ';')):\n            return False\n    return False\nstarts = [place for place, line in enumerate(lines) if line.split()[:1] in (['walk:'], ['_walk:'])]\nloops = [place for place, line in enumerate(lines) if 'Loop Header' in line]\nprint('function at 64:', 'yes' if starts and all(at_64(place) for place in starts) else 'no')\nprint('loops at 64:', 'yes' if loops and all(at_64(place) for place in loops) else 'no')", "{root}/.toolchain/tools", "{root}", "{target}", "{case}", "hidden"] }
