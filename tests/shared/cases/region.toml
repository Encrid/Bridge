[[case]]
name = "region_take-with-no-gap-takes-at-the-end"
run = ["{out}/region{exe}", "100", "take", "10", "take", "20"]
claims = { status = 0, order = ["take 10: at 0", "take 20: at 10", "used 30 peak 30 gaps 0:"] }
false = { run = ["{out}/region{exe}", "100", "take", "10", "take", "30"] }

